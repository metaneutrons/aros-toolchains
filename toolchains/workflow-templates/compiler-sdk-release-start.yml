# Inactive future caller. Keep this template outside .github/workflows until
# the protected-start integration is separately qualified and deliberately installed.
name: Protected compiler and SDK start

on:
  workflow_run:
    workflows: ['Producer contracts']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fixed-compiler-sdk-protected-start-main
  cancel-in-progress: false

jobs:
  protected-start:
    name: Create protected compiler and SDK start
    if: >-
      github.repository == 'metaneutrons/aros-toolchains' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Producer contracts' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.repository.full_name == 'metaneutrons/aros-toolchains' &&
      github.event.workflow_run.head_repository.full_name == 'metaneutrons/aros-toolchains'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout reviewed main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage private controller root
        id: private-root
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runner_temp=$(cd -- "$RUNNER_TEMP" && pwd -P)
          root="$runner_temp/aros-protected-start-v2"
          if [[ -e "$root" || -L "$root" ]]; then
            echo 'private controller root is already occupied' >&2
            exit 1
          fi
          mkdir -- "$root"
          if [[ -L "$root" || ! -d "$root" || "$(stat -c '%u' -- "$root")" != "$(id -u)" ]]; then
            echo 'new controller root has an unexpected identity' >&2
            exit 1
          fi
          if [[ "$(stat -c '%a' -- "$root")" != 700 ]]; then
            chmod 700 -- "$root"
          fi
          root=$(cd -- "$root" && pwd -P)
          [[ "$root" == "$runner_temp/aros-protected-start-v2" ]]
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Admit exact release candidate
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$(cd -- "$RUNNER_TEMP" && pwd -P)/aros-protected-start-v2"
          python3 -B scripts/toolchain/release-admission-v2.py admit \
            --output "$root/admission.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate derived Release Please draft configuration
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/prepare-release-draft-config-v2.py \
            --output "$PRIVATE_ROOT/draft-config-check.json"

      - name: Install pinned Cosign
        if: success() && steps.admit.outputs.ready == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Create the admitted annotated candidate tag
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/create-compiler-sdk-candidate-v2.py create-tag \
            --admission "$PRIVATE_ROOT/admission.json" \
            --runtime-lock "$GITHUB_WORKSPACE/toolchains/aros-tools-runtime-v1.json" \
            --runtime-directory "$PRIVATE_ROOT/runtime" \
            --runtime-interface "$PRIVATE_ROOT/runtime-interface.json" \
            --output "$PRIVATE_ROOT/tag.json"

      - name: Create the admitted private Release Please draft
        id: release-please
        if: success() && steps.admit.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: toolchains/release-please-draft-config-v2.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: false
          skip-github-pull-request: true
          skip-labeling: true

      - name: Bind the private draft to the admitted tag
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
          RP_CREATED: ${{ steps.release-please.outputs.release_created }}
          RP_TAG: ${{ steps.release-please.outputs.tag_name }}
          RP_SHA: ${{ steps.release-please.outputs.sha }}
          RP_VERSION: ${{ steps.release-please.outputs.version }}
          RP_ID: ${{ steps.release-please.outputs.id }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/create-compiler-sdk-candidate-v2.py bind-draft \
            --admission "$PRIVATE_ROOT/admission.json" \
            --runtime-lock "$GITHUB_WORKSPACE/toolchains/aros-tools-runtime-v1.json" \
            --runtime-directory "$PRIVATE_ROOT/runtime" \
            --runtime-interface "$PRIVATE_ROOT/runtime-interface.json" \
            --output "$PRIVATE_ROOT/draft.json" \
            --tag "$PRIVATE_ROOT/tag.json"

      - name: Construct the unsigned compiler and SDK start record
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/construct-compiler-sdk-start-v2.py \
            --admission "$PRIVATE_ROOT/admission.json" \
            --tag "$PRIVATE_ROOT/tag.json" \
            --draft "$PRIVATE_ROOT/draft.json" \
            --runtime-lock "$GITHUB_WORKSPACE/toolchains/aros-tools-runtime-v1.json" \
            --runtime-directory "$PRIVATE_ROOT/runtime" \
            --runtime-interface "$PRIVATE_ROOT/runtime-interface.json" \
            --output "$PRIVATE_ROOT/compiler-sdk-release-start-v2.json"

      - name: Capture record path and pre-sign digest
        id: record
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          record_path="$PRIVATE_ROOT/compiler-sdk-release-start-v2.json"
          test -f "$record_path"
          record_sha256=$(sha256sum -- "$record_path" | awk '{print $1}')
          [[ "$record_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'path=%s\nsha256=%s\n' "$record_path" "$record_sha256" >> "$GITHUB_OUTPUT"

      - name: Attest the start record with build provenance
        id: signature
        if: success() && steps.admit.outputs.ready == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.record.outputs.path }}
          push-to-registry: false
          create-storage-record: false

      - name: Seal the exact record and attestation bundle
        if: success() && steps.admit.outputs.ready == 'true'
        env:
          PRIVATE_ROOT: ${{ steps.private-root.outputs.root }}
          RECORD_PATH: ${{ steps.record.outputs.path }}
          RECORD_SHA256: ${{ steps.record.outputs.sha256 }}
          BUNDLE_PATH: ${{ steps.signature.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/seal-compiler-sdk-start-v2.py \
            --record "$RECORD_PATH" \
            --bundle "$BUNDLE_PATH" \
            --expected-record-sha256 "$RECORD_SHA256" \
            --output-directory "$PRIVATE_ROOT/retained"

      - name: Upload only the sealed start transport
        if: success() && steps.admit.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-sdk-release-start-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.private-root.outputs.root }}/retained/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
