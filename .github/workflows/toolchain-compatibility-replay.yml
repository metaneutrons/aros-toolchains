name: AROS Toolchain Compatibility Replay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed producer run containing verified-* artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  LLVM_VERSION: 11.0.0
  PROFILES: toolchains/profiles-v1.json
  SOURCE_LOCK: toolchains/llvm-11.0.0.sources.json
  AROS_SOURCE_REPOSITORY: metaneutrons/AROS-NX
  AROS_SOURCE_COMMIT: 7abaf5511753807176ef1bc3020d8c4187f5664a
  AROS_TOOLS_REPOSITORY: metaneutrons/aros-tools
  AROS_TOOLS_COMMIT: 272bd110c279421375c927c7bfd415b866719ced

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04, profile: pc-x86_64 }
          - { host: linux-x86_64, runner: ubuntu-24.04, profile: arm-raspi }
          - { host: linux-x86_64, runner: ubuntu-24.04, profile: rpi-aarch64 }
          - { host: linux-aarch64, runner: ubuntu-24.04-arm, profile: pc-x86_64 }
          - { host: linux-aarch64, runner: ubuntu-24.04-arm, profile: arm-raspi }
          - { host: linux-aarch64, runner: ubuntu-24.04-arm, profile: rpi-aarch64 }
          - { host: macos-x86_64, runner: macos-15-intel, profile: pc-x86_64 }
          - { host: macos-x86_64, runner: macos-15-intel, profile: arm-raspi }
          - { host: macos-x86_64, runner: macos-15-intel, profile: rpi-aarch64 }
          - { host: macos-aarch64, runner: macos-15, profile: pc-x86_64 }
          - { host: macos-aarch64, runner: macos-15, profile: arm-raspi }
          - { host: macos-aarch64, runner: macos-15, profile: rpi-aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AROS_SOURCE_REPOSITORY }}
          ref: ${{ env.AROS_SOURCE_COMMIT }}
          submodules: recursive
          path: dependencies/aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AROS_TOOLS_REPOSITORY }}
          ref: ${{ env.AROS_TOOLS_COMMIT }}
          path: dependencies/aros-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-${{ matrix.host }}-${{ matrix.profile }}
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-toolchain-sources
          path: source-cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: ./.github/actions/setup-aros-rust
      - name: Install audited consumer prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Two-root relocation and pinned upstream compatibility
        env:
          AROS_TOOLCHAIN_SOURCE_CACHE: ${{ github.workspace }}/source-cache
        run: |
          set -euo pipefail
          asset="aros-toolchain-v1-llvm${LLVM_VERSION}-${{ matrix.host }}-${{ matrix.profile }}.tar.xz"
          upstream_commit=$(python3 -c 'import json; print(json.load(open("toolchains/profiles-v1.json"))["upstream_commit"])')
          scripts/toolchain/compatibility.sh \
            "$GITHUB_WORKSPACE/verified/$asset" \
            "${{ matrix.host }}" \
            "${{ matrix.profile }}" \
            "$GITHUB_WORKSPACE/$PROFILES" \
            "$upstream_commit" \
            "$RUNNER_TEMP/consumer-${{ matrix.profile }}" \
            "$GITHUB_WORKSPACE/dependencies/aros" \
            "$GITHUB_WORKSPACE/dependencies/aros-tools"
