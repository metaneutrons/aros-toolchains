# Compiler qualification run of the split V2 qualification
# (docs/plans/split-compiler-sdk-qualification.md, M2). It builds every native
# compiler copy, compares the A/B copies of every lane in the compiler
# candidate assembly and retains one signed compiler run manifest. The SDK
# qualification run (toolchain-sdk-v2.yml) consumes this run on the same
# producer commit. Nothing here creates tags, drafts or releases.
name: Toolchain V2 compilers

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: toolchain-compilers-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_LOCK: toolchains/llvm-11.0.0.sources.json
  COMPATIBILITY_PORTS_LOCK: toolchains/compatibility-ports-v3.json
  PROFILES: toolchains/profiles-v1.json
  LLVM_VERSION: 11.0.0
  PYTHONHASHSEED: "0"
  AROS_SOURCE_REPOSITORY: metaneutrons/AROS-NX
  AROS_SOURCE_COMMIT: 777552199e803c7c0c6ec34800af7506cd022229
  TOOLS_RUNTIME_LOCK: toolchains/aros-tools-runtime-v1.json


jobs:
  inputs:
    name: Inputs
    uses: ./.github/workflows/toolchain-v2-inputs.yml
    with:
      mode: qualify-v2-full
      scope: full

  v2-build:
    name: Native compiler (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }}, ${{ matrix.copy }})
    if: needs.inputs.outputs.full_matrix == 'true'
    needs: inputs
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inputs.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.inputs.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.inputs.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cargo-cache-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-cargo-input
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install native compiler prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Select installed macOS LLVM tools
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/select-macos-native-llvm.sh
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.inputs.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: ${{ matrix.host }}
      - id: lane
        name: Select the exact original compiler lane
        env:
          SELECTED_GROUP: ${{ matrix.group_id }}
          SELECTED_HOST: ${{ matrix.host }}
          SELECTED_PRESET: ${{ matrix.profile }}
          SELECTED_COPY: ${{ matrix.copy }}
          SELECTED_RELEASE_ID: ${{ needs.inputs.outputs.release_id }}
          CACHE_ARCHIVE_SHA256: ${{ needs.inputs.outputs.cache_archive_sha256 }}
          CARGO_ARCHIVE_SHA256: ${{ fromJSON(needs.inputs.outputs.cache_archives)[matrix.host] }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cache-input/diagnostic-cache.tar.gz" \
            --archive-sha256 "$CACHE_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cargo-input/native-cargo-cache.tar.gz" \
            --archive-sha256 "$CARGO_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache/cargo"
          "$runtime/bin/aros" cache cargo verify --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --dir "$RUNNER_TEMP/diagnostic-cache" \
            --cargo "${{ steps.rust.outputs.cargo }}"
          inputs="$RUNNER_TEMP/diagnostic-inputs"
          inputs_sha=$(shasum -a 256 "$inputs/toolchain-release-inputs-v2.json" | awk '{print $1}')
          "$runtime/bin/aros" toolchain producer release-plan --directory "$inputs" \
            --inputs-sha256 "$inputs_sha" --format json > "$RUNNER_TEMP/build-plan.json"
          jq -e --arg group "$SELECTED_GROUP" --arg host "$SELECTED_HOST" --arg profile "$SELECTED_PRESET" \
            'any(.lanes[]; .group_id == $group and .host == $host and .target_profile == $profile)' \
            "$RUNNER_TEMP/build-plan.json" >/dev/null
          group=$(jq -ce --arg group "$SELECTED_GROUP" '.groups | map(select(.group_id == $group)) | if length == 1 then .[0] else error("ambiguous group") end' "$RUNNER_TEMP/build-plan.json")
          recipe_file=$(jq -er '.recipe.file' <<< "$group")
          lock_file=$(jq -er '.source_lock.file' <<< "$group")
          profiles_file=$(jq -er '.profiles.file' <<< "$group")
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          {
            printf 'recipe=%s/%s\n' "$inputs" "$recipe_file"
            printf 'lock=%s/%s\n' "$inputs" "$lock_file"
            printf 'profiles=%s/%s\n' "$inputs" "$profiles_file"
            printf 'runtime-sha256=%s\n' "$runtime_sha"
            printf 'release-id=%s\n' "$SELECTED_RELEASE_ID"
          } >> "$GITHUB_OUTPUT"
      - name: Record runner hardware for reproducibility diagnosis
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            lscpu | grep -E '^(Architecture|Vendor ID|Model name|CPU family|Model|Stepping|CPU\(s\)):'
            grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512[a-z]*|bmi2|adx|sse4_2)$' | sort | tr '\n' ' ' || true
            echo
          else
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.ncpu
          fi
      - uses: ./.github/actions/build-native-lane-v2
        with:
          aros: ${{ runner.temp }}/diagnostic-runtime/bin/aros
          aros-sha256: ${{ steps.lane.outputs.runtime-sha256 }}
          recipe: ${{ steps.lane.outputs.recipe }}
          source-lock: ${{ steps.lane.outputs.lock }}
          profiles: ${{ steps.lane.outputs.profiles }}
          source-dir: ${{ github.workspace }}/dependencies/aros
          producer-dir: ${{ runner.temp }}/diagnostic-producer
          tools-dir: ${{ github.workspace }}/dependencies/aros-tools
          cache-dir: ${{ runner.temp }}/diagnostic-cache
          group: ${{ matrix.group_id }}
          preset: ${{ matrix.profile }}
          host: ${{ matrix.host }}
          copy: ${{ matrix.copy }}
          release-id: ${{ steps.lane.outputs.release-id }}
          jobs: '3'
          timeout-seconds: '20000'
          root: ${{ runner.temp }}/native-lane-${{ matrix.copy }}
          workflow: .github/workflows/toolchain-compilers-v2.yml
          job-name: Native compiler (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }}, ${{ matrix.copy }})
      - name: Retain native owner failure diagnostics outside the signed payload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-native-${{ matrix.group_id }}-${{ matrix.host }}-${{ matrix.profile }}-${{ matrix.copy }}
          path: |
            ${{ runner.temp }}/native-lane-${{ matrix.copy }}/work/native-lifecycle/logs/
            ${{ runner.temp }}/native-lane-${{ matrix.copy }}/work/native-lifecycle/receipts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  compiler-assembly:
    name: Assemble and compare compiler candidates
    needs: [inputs, v2-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
      # Signs only the compiler run manifest observation.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-linux-x86_64
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.inputs.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: linux-x86_64
      - name: Read back every compiler owner, verify and compare the A/B copies
        id: assembly
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TOOLS: ${{ needs.inputs.outputs.tools_commit }}
          SELECTED_RELEASE_ID: ${{ needs.inputs.outputs.release_id }}
          CURRENT_JOB: Assemble and compare compiler candidates
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'compiler-run-context'
          root.mkdir(mode=0o700)
          with (root / 'context.json').open('xb') as handle:
              handle.write(origin.canonical(origin.context_from_environment('.github/workflows/toolchain-compilers-v2.yml')))
          PY
          context="$RUNNER_TEMP/compiler-run-context/context.json"
          context_sha=$(shasum -a 256 "$context" | awk '{print $1}')
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          inputs_sha=$(shasum -a 256 "$RUNNER_TEMP/diagnostic-inputs/toolchain-release-inputs-v2.json" | awk '{print $1}')
          bash scripts/toolchain/collect-compiler-owners-v2.sh \
            --aros "$runtime/bin/aros" --aros-sha256 "$runtime_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --source-workflow .github/workflows/toolchain-compilers-v2.yml --source-ref "$GITHUB_REF" \
            --workflow .github/workflows/toolchain-compilers-v2.yml --job-name "$CURRENT_JOB" --same-attempt \
            --release-id "$SELECTED_RELEASE_ID" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --root "$RUNNER_TEMP/compiler-readback"
          plan="$RUNNER_TEMP/compiler-native-plan.json"
          required_paths="$RUNNER_TEMP/compiler-required-paths.json"
          summary="$RUNNER_TEMP/compiler-assembly-summary.json"
          for selected in "$plan" "$required_paths" "$summary"; do
            test ! -e "$selected" && test ! -L "$selected"
          done
          set -C
          "$runtime/bin/aros" toolchain producer release-plan \
            --directory "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --format json > "$plan"
          plan_sha=$(shasum -a 256 "$plan" | awk '{print $1}')
          policy="$GITHUB_WORKSPACE/toolchains/compiler-required-payload-v1.json"
          policy_sha=$(shasum -a 256 "$policy" | awk '{print $1}')
          python3 -B scripts/toolchain/required-compiler-payload-v2.py \
            --policy "$policy" --policy-sha256 "$policy_sha" \
            --plan "$plan" --plan-sha256 "$plan_sha" \
            --inputs-sha256 "$inputs_sha" --producer-commit "$GITHUB_SHA" \
            --tools-commit "$EXPECTED_TOOLS" > "$required_paths"
          required_paths_sha=$(shasum -a 256 "$required_paths" | awk '{print $1}')
          fragment="$RUNNER_TEMP/compiler-readback/selection-fragment.json"
          fragment_sha=$(shasum -a 256 "$fragment" | awk '{print $1}')
          python3 -B scripts/toolchain/assemble-compiler-candidate-v2.py \
            --aros "$runtime/bin/aros" --aros-sha256 "$runtime_sha" \
            --plan "$plan" --plan-sha256 "$plan_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --fragment "$fragment" --fragment-sha256 "$fragment_sha" \
            --owner-root "$RUNNER_TEMP/compiler-readback" \
            --required-paths "$required_paths" --required-paths-sha256 "$required_paths_sha" \
            --release-id "$SELECTED_RELEASE_ID" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --root "$RUNNER_TEMP/compiler-candidate" > "$summary"
          summary_sha=$(shasum -a 256 "$summary" | awk '{print $1}')
          printf 'context=%s\ncontext_sha256=%s\nsummary=%s\nsummary_sha256=%s\nfragment=%s\nfragment_sha256=%s\n' \
            "$context" "$context_sha" "$summary" "$summary_sha" "$fragment" "$fragment_sha" >> "$GITHUB_OUTPUT"
      - id: manifest
        uses: ./.github/actions/retain-compiler-manifest-v2
        with:
          context: ${{ steps.assembly.outputs.context }}
          context-sha256: ${{ steps.assembly.outputs.context_sha256 }}
          summary: ${{ steps.assembly.outputs.summary }}
          summary-sha256: ${{ steps.assembly.outputs.summary_sha256 }}
          fragment: ${{ steps.assembly.outputs.fragment }}
          fragment-sha256: ${{ steps.assembly.outputs.fragment_sha256 }}
          root: ${{ runner.temp }}/compiler-manifest
          workflow: .github/workflows/toolchain-compilers-v2.yml
          job-name: Assemble and compare compiler candidates
      - name: Retain compiler assembly failure diagnostics outside the signed manifest
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-compiler-assembly
          path: |
            ${{ runner.temp }}/compiler-candidate/native/
            ${{ runner.temp }}/compiler-candidate/reports/
          if-no-files-found: ignore
          retention-days: 7
