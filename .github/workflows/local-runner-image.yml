name: Build the local Linux runner image

# Builds ci/local-runner-linux natively for linux/amd64 on a GitHub-hosted runner
# (building it under emulation on an arm64 workstation crashes the compiler) and
# keeps the image as a workflow artifact. It cannot publish and never runs on a
# local runner. Load the artifact onto a NAS as described in ci/local-runner-linux/README.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build runner image (linux/amd64)
    if: github.repository == 'metaneutrons/aros-toolchains' && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t aros-toolchains-runner:local ci/local-runner-linux
          docker run --rm --entrypoint sh aros-toolchains-runner:local -c \
            'git --version && git --no-lazy-fetch --version && rustup --version'
          docker save aros-toolchains-runner:local | gzip -n > "$RUNNER_TEMP/runner-rustup.tar.gz"
          sha256sum "$RUNNER_TEMP/runner-rustup.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-runner-image
          path: ${{ runner.temp }}/runner-rustup.tar.gz
          retention-days: 7
          compression-level: 0
