name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Issue a repository-scoped Release Please App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: aros-toolchains
          permission-contents: write
          permission-pull-requests: write
      - name: Verify App and repository scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ "$APP_SLUG" == metaneutrons-release-please ]] || {
            echo 'unexpected Release Please App identity' >&2
            exit 1
          }
          gh api 'installation/repositories?per_page=100' --paginate --slurp |
            jq -e --arg repository "$GITHUB_REPOSITORY" '
              length > 0 and all(.[]; .total_count == 1) and
              ([.[].repositories[].full_name] == [$repository])
            ' >/dev/null
      - name: Prepare version and changelog pull request only
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
