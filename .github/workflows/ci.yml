name: Producer contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_origin_probe:
        description: 'Run the non-publishing owning-job artifact transport probe'
        type: boolean
        default: false
      artifact_origin_source:
        description: 'Closed independently measured source selection JSON for a read-only prior-run probe'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: producer-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  AROS_SOURCE_REPOSITORY: metaneutrons/AROS-NX
  AROS_SOURCE_COMMIT: 15230bef9d23e12cd9d4cca62253c4b62276e8ff
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: producer
      - name: Checkout exact AROS-NX source contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.AROS_SOURCE_REPOSITORY }}
          ref: ${{ env.AROS_SOURCE_COMMIT }}
          path: aros-source
      - name: Run complete offline producer contract suite
        working-directory: producer
        env:
          AROS_TEST_SOURCE_ROOT: ${{ github.workspace }}/aros-source
        run: scripts/toolchain/tests/test-producer.sh

  artifact-origin-probe:
    name: Artifact origin probe
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_origin_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      payload-id: ${{ steps.payload.outputs.artifact-id }}
      proof-id: ${{ steps.proof.outputs.artifact-id }}
    env:
      PAYLOAD_NAME: artifact-origin-payload-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact diagnostic workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stage only the two selected diagnostic files
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/artifact-origin-payload"
          for fixture in smoke.c smoke.cpp; do
            test -f "scripts/toolchain/fixtures/$fixture"
            test ! -L "scripts/toolchain/fixtures/$fixture"
            cp "scripts/toolchain/fixtures/$fixture" "$RUNNER_TEMP/artifact-origin-payload/$fixture"
          done
      - name: Upload the closed two-file diagnostic payload
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PAYLOAD_NAME }}
          path: ${{ runner.temp }}/artifact-origin-payload/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Bind upload and file bytes to this authenticated owning job
        env:
          PAYLOAD_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/artifact-origin-proof"
          python3 -B scripts/toolchain/artifact-origin.py record \
            --workflow .github/workflows/ci.yml --job-name 'Artifact origin probe' \
            --artifact-id "$PAYLOAD_ID" --artifact-name "$PAYLOAD_NAME" \
            --artifact-sha256 "$PAYLOAD_SHA256" \
            --role diagnostic --group probe --host linux-x86_64 --profile fixture --copy none \
            --payload-dir "$RUNNER_TEMP/artifact-origin-payload" \
            --output "$RUNNER_TEMP/artifact-origin-proof/origin.json"
      - name: Sign the origin record on its owning job
        id: origin-signature
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/artifact-origin-proof/origin.json
      - name: Retain the exact signature bundle separately from the payload
        env:
          ORIGIN_BUNDLE: ${{ steps.origin-signature.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$ORIGIN_BUNDLE" && test ! -L "$ORIGIN_BUNDLE"
          cp "$ORIGIN_BUNDLE" "$RUNNER_TEMP/artifact-origin-proof/origin.sigstore.json"
      - name: Upload the signed origin proof
        id: proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-origin-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-origin-proof/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  artifact-origin-verification:
    name: Verify artifact origin
    needs: artifact-origin-probe
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_origin_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD_ID: ${{ needs.artifact-origin-probe.outputs.payload-id }}
      PAYLOAD_NAME: artifact-origin-payload-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact read-only diagnostic verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the one proof by numeric artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.artifact-origin-probe.outputs.proof-id }}
          path: ${{ runner.temp }}/artifact-origin-proof
          merge-multiple: true
          digest-mismatch: error
      - name: Independently verify provider job, signature and exact artifact bytes
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/artifact-origin.py verify \
            --workflow .github/workflows/ci.yml --job-name 'Artifact origin probe' \
            --artifact-id "$PAYLOAD_ID" --artifact-name "$PAYLOAD_NAME" \
            --role diagnostic --group probe --host linux-x86_64 --profile fixture --copy none \
            --origin "$RUNNER_TEMP/artifact-origin-proof/origin.json" \
            --bundle "$RUNNER_TEMP/artifact-origin-proof/origin.sigstore.json"
      - name: Reject a modified isolated origin record
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/artifact-origin-counterprobe"
          cp "$RUNNER_TEMP/artifact-origin-proof/origin.json" \
            "$RUNNER_TEMP/artifact-origin-counterprobe/origin.json"
          printf '\n' >> "$RUNNER_TEMP/artifact-origin-counterprobe/origin.json"
          if python3 -B scripts/toolchain/artifact-origin.py verify \
            --workflow .github/workflows/ci.yml --job-name 'Artifact origin probe' \
            --artifact-id "$PAYLOAD_ID" --artifact-name "$PAYLOAD_NAME" \
            --role diagnostic --group probe --host linux-x86_64 --profile fixture --copy none \
            --origin "$RUNNER_TEMP/artifact-origin-counterprobe/origin.json" \
            --bundle "$RUNNER_TEMP/artifact-origin-proof/origin.sigstore.json" \
            2> "$RUNNER_TEMP/artifact-origin-counterprobe/rejection.log"; then
            echo 'modified origin unexpectedly passed authentication' >&2
            exit 1
          fi
          grep -Fx \
            'artifact origin verification failed: origin signature authentication failed; no retry or credential fallback' \
            "$RUNNER_TEMP/artifact-origin-counterprobe/rejection.log"

  artifact-origin-same-attempt-verification:
    name: Verify same-attempt artifact retention
    needs: artifact-origin-probe
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_origin_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD_ID: ${{ needs.artifact-origin-probe.outputs.payload-id }}
      PROOF_ID: ${{ needs.artifact-origin-probe.outputs.proof-id }}
    steps:
      - name: Checkout exact non-publishing transport reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the completed owner and original uploads independently
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          context = origin.context_from_environment('.github/workflows/ci.yml')
          pages = origin.jobs_for(context)
          jobs = origin.complete_jobs(pages)
          owners = [job for job in jobs if job['name'] == 'Artifact origin probe']
          origin.require(len(owners) == 1, 'diagnostic owner is not unique')
          owner = {'id': owners[0]['id'], 'name': 'Artifact origin probe'}
          origin.select_source_job(pages, context, owner)
          artifacts = {}
          for key, prefix, variable in (
              ('artifact', 'artifact-origin-payload', 'PAYLOAD_ID'),
              ('proof', 'artifact-origin-proof', 'PROOF_ID'),
          ):
              identity = origin.positive(os.environ[variable])
              name = f'{prefix}-{context["run_id"]}-{context["run_attempt"]}'
              observed = origin.gh_json(['api', f'repos/{context["repository"]}/actions/artifacts/{identity}'])
              digest = observed.get('digest', '')
              origin.require(isinstance(digest, str) and digest.startswith('sha256:'),
                             'provider upload has no SHA-256 digest')
              artifacts[key] = origin.select_artifact(observed, context, identity, name, digest[7:])
          selected = {
              'schema': origin.SELECTION_SCHEMA, 'context': context,
              'selection': {'role': 'diagnostic', 'group': 'probe',
                  'host': 'linux-x86_64', 'profile': 'fixture', 'copy': 'none'},
              'job': owner, **artifacts,
          }
          origin.source_selection(selected, context, same_attempt=True)
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'same-attempt-origin'
          root.mkdir(mode=0o700)
          with (root / 'selection.json').open('xb') as handle:
              handle.write(origin.canonical(selected))
          PY
      - name: Authenticate and retain raw transport without extraction
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/artifact-origin.py verify-source \
            --workflow .github/workflows/ci.yml --job-name 'Verify same-attempt artifact retention' \
            --same-attempt --source-selection "$RUNNER_TEMP/same-attempt-origin/selection.json" \
            --verified-output-dir "$RUNNER_TEMP/same-attempt-origin/verified"
      - name: Check retained diagnostic bytes and reject changed ZIP bytes
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'same-attempt-origin'
          retained = root / 'verified'
          origin.require({path.name for path in retained.iterdir()} ==
              {'payload.zip', 'origin.json', 'origin.sigstore.json', 'selection.json'},
              'retained transport inventory differs')
          origin.require((root / 'selection.json').read_bytes() ==
              (retained / 'selection.json').read_bytes(), 'retained selection differs')
          selected = origin.parse_json((retained / 'selection.json').read_bytes())
          record = origin.parse_json((retained / 'origin.json').read_bytes())
          payload = selected['artifact']
          origin.verify_zip(retained / 'payload.zip', record['files'],
                            payload['sha256'], payload['size_in_bytes'])
          # Alter only a new isolated diagnostic copy. Never touch the retained ZIP.
          changed = bytearray((retained / 'payload.zip').read_bytes())
          changed[0] ^= 1
          corrupted = root / 'corrupted.zip'
          with corrupted.open('xb') as handle:
              handle.write(changed)
          try:
              origin.verify_zip(corrupted, record['files'], payload['sha256'], payload['size_in_bytes'])
          except origin.OriginError as error:
              origin.require(str(error) == 'downloaded artifact ZIP digest or size differs',
                             'changed ZIP failed at the wrong boundary')
              print('Changed retained ZIP copy rejected; transport only, not native admission.')
          else:
              raise SystemExit('changed retained ZIP unexpectedly passed')
          PY

  artifact-origin-source-verification:
    name: Verify prior-run artifact origin
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_origin_source != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact read-only cross-run verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate independent source selection without changing caller identity
        env:
          SOURCE_SELECTION: ${{ inputs.artifact_origin_source }}
          SAME_RUN_PROBE: ${{ inputs.artifact_origin_probe }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          origin.require(os.environ['SAME_RUN_PROBE'] == 'false', 'select only one diagnostic probe')
          ctx = origin.context_from_environment('.github/workflows/ci.yml')
          selected = origin.source_selection(origin.parse_json(os.environ['SOURCE_SELECTION'].encode()), ctx)
          # Diagnostic scope only. Production must select a reviewed release
          # workflow/commit independently; this cannot qualify a compiler.
          origin.require(selected['context']['workflow'] == '.github/workflows/ci.yml'
                         and selected['selection'] == {'role': 'diagnostic', 'group': 'probe',
                             'host': 'linux-x86_64', 'profile': 'fixture', 'copy': 'none'}
                         and selected['job']['name'] == 'Artifact origin probe',
                         'cross-run diagnostic source is not the selected fixture owner')
          root = Path(os.environ['RUNNER_TEMP']) / 'artifact-origin-source'
          root.mkdir()
          with (root / 'selection.json').open('xb') as handle:
              handle.write(origin.canonical(selected))
          PY
      - name: Verify source signature, both original ZIPs and current reader job separately
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/artifact-origin.py verify-source \
            --workflow .github/workflows/ci.yml --job-name 'Verify prior-run artifact origin' \
            --source-selection "$RUNNER_TEMP/artifact-origin-source/selection.json"
      - name: Reject an independently selected wrong source job
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'artifact-origin-source'
          selected = json.loads((root / 'selection.json').read_bytes())
          selected['job']['id'] += 1
          with (root / 'wrong-job.json').open('x') as handle:
              json.dump(selected, handle)
          PY
          if python3 -B scripts/toolchain/artifact-origin.py verify-source \
            --workflow .github/workflows/ci.yml --job-name 'Verify prior-run artifact origin' \
            --source-selection "$RUNNER_TEMP/artifact-origin-source/wrong-job.json" \
            2> "$RUNNER_TEMP/artifact-origin-source/rejection.log"; then
            echo 'wrong source job unexpectedly passed' >&2
            exit 1
          fi
          grep -Fx \
            'artifact origin verification failed: source job ID/name does not select one provider job' \
            "$RUNNER_TEMP/artifact-origin-source/rejection.log"
      - name: Reject modified local proof bytes after bounded source retrieval
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import argparse
          import importlib.util
          import os
          from pathlib import Path
          import tempfile
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          caller = origin.context_from_environment('.github/workflows/ci.yml')
          plan = Path(os.environ['RUNNER_TEMP']) / 'artifact-origin-source/selection.json'
          selected = origin.source_selection(origin.parse_json(plan.read_bytes()), caller)
          with tempfile.TemporaryDirectory(prefix='origin-counterprobe-', dir=os.environ['RUNNER_TEMP']) as temporary:
              root = Path(temporary).resolve()
              archive = root / 'proof.zip'
              origin.download_proof(selected['context'], selected['proof'], archive)
              files = origin.proof_members(archive, selected['proof'])
              origin.require(files['origin.json'].endswith(b'\n'), 'counterprobe requires a canonical record')
              files['origin.json'] = files['origin.json'][:-1] + b' '
              for name, raw in files.items():
                  with (root / name).open('xb') as handle:
                      handle.write(raw)
              args = argparse.Namespace(workflow='.github/workflows/ci.yml',
                  job_name='Verify prior-run artifact origin', source_selection=plan,
                  origin=root / 'origin.json', bundle=root / 'origin.sigstore.json')
              try:
                  origin.verify_source(args, caller)
              except origin.OriginError as error:
                  origin.require(str(error) == 'ZIP member bytes differ', 'modified proof failed at the wrong boundary')
                  print('Modified local proof rejected against exact original ZIP; not release qualification.')
              else:
                  raise SystemExit('modified local proof unexpectedly passed')
          PY
