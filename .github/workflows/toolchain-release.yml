            --policy "$policy" --policy-sha256 "$policy_sha" \
            --plan "$plan" --plan-sha256 "$plan_sha" \
            --inputs-sha256 "$inputs_sha" --producer-commit "$GITHUB_SHA" \
            --tools-commit "$EXPECTED_TOOLS" > "$required_paths"
          required_paths_sha=$(shasum -a 256 "$required_paths" | awk '{print $1}')
          compiler_fragment="$RUNNER_TEMP/complete-compiler-readback/selection-fragment.json"
          compiler_fragment_sha=$(shasum -a 256 "$compiler_fragment" | awk '{print $1}')
          support="$GITHUB_WORKSPACE/dependencies/aros-tools-fixtures/crates/aros-common/tests/fixtures"
          manifest_schema_sha=$(shasum -a 256 "$support/toolchain-manifest-v2.schema.json" | awk '{print $1}')
          tree_fixture_sha=$(shasum -a 256 "$support/tree-digest-v1.fixture.json" | awk '{print $1}')
          python3 -B scripts/toolchain/assemble-release-candidate-v2.py \
            --aros "$runtime/bin/aros" --aros-sha256 "$runtime_sha" \
            --plan "$plan" --plan-sha256 "$plan_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --compiler-fragment "$compiler_fragment" --compiler-fragment-sha256 "$compiler_fragment_sha" \
            --compiler-owner-root "$RUNNER_TEMP/complete-compiler-readback" \
            --sdk-fragment "$fragment" --sdk-fragment-sha256 "$fragment_sha" \
            --sdk-owner-root "$RUNNER_TEMP/complete-sdk-readback" \
            --required-paths "$required_paths" --required-paths-sha256 "$required_paths_sha" \
            --support-dir "$support" --manifest-schema-sha256 "$manifest_schema_sha" \
            --tree-fixture-sha256 "$tree_fixture_sha" \
            --release-id "$SELECTED_RELEASE_ID" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$SELECTED_RELEASE_ID" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --root "$RUNNER_TEMP/release-candidate" > "$candidate_summary"
          compiler_lanes="$RUNNER_TEMP/release-candidate/compiler-stage/compiler-index-lanes.json"
          compiler_evidence="$RUNNER_TEMP/release-candidate/compiler-stage/compiler-evidence-fragment.json"
          candidate_index="$RUNNER_TEMP/release-candidate/release/toolchain-index-v2.json"
          evidence_selection="$RUNNER_TEMP/native-release-evidence-selection.json"
          test ! -e "$evidence_selection" && test ! -L "$evidence_selection"
          compiler_lanes_sha=$(shasum -a 256 "$compiler_lanes" | awk '{print $1}')
          compiler_evidence_sha=$(shasum -a 256 "$compiler_evidence" | awk '{print $1}')
          candidate_index_sha=$(shasum -a 256 "$candidate_index" | awk '{print $1}')
          python3 -B scripts/toolchain/select-native-release-evidence-v2.py \
            --plan "$plan" --plan-sha256 "$plan_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --compiler-lanes "$compiler_lanes" --compiler-lanes-sha256 "$compiler_lanes_sha" \
            --compiler-evidence "$compiler_evidence" --compiler-evidence-sha256 "$compiler_evidence_sha" \
            --sdk-fragment "$fragment" --sdk-fragment-sha256 "$fragment_sha" \
            --sdk-owner-root "$RUNNER_TEMP/complete-sdk-readback" \
