          measured_subject_sha=$(shasum -a 256 "$subject_manifest" | awk '{print $1}')
          [[ "$candidate_index_sha" == "$held_index_sha" && "$measured_subject_sha" == "$subject_sha" ]]
          evidence_sha=$(shasum -a 256 "$evidence_selection" | awk '{print $1}')
          summary_sha=$(shasum -a 256 "$candidate_summary" | awk '{print $1}')
          printf 'index_sha256=%s\nsubject_sha256=%s\nselection_sha256=%s\nsummary_sha256=%s\ninputs_sha256=%s\nruntime_sha256=%s\n' \
            "$held_index_sha" "$subject_sha" "$evidence_sha" "$summary_sha" "$inputs_sha" "$runtime_sha" >> "$GITHUB_OUTPUT"
      - name: Attest closed combined diagnostic subjects
        id: candidate-provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-checksums: ${{ runner.temp }}/release-candidate/subject-manifest.json
      - name: Verify genuine combined candidate provenance and final native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.candidate-provenance.outputs.bundle-path }}
          EXPECTED_INDEX_SHA: ${{ steps.candidate.outputs.index_sha256 }}
          EXPECTED_SUBJECT_SHA: ${{ steps.candidate.outputs.subject_sha256 }}
          EXPECTED_SELECTION_SHA: ${{ steps.candidate.outputs.selection_sha256 }}
          SELECTED_RELEASE_ID: ${{ needs.v2-prepare.outputs.release_id }}
          EXPECTED_SUMMARY_SHA: ${{ steps.candidate.outputs.summary_sha256 }}
          EXPECTED_INPUTS_SHA: ${{ steps.candidate.outputs.inputs_sha256 }}
          EXPECTED_RUNTIME_SHA: ${{ steps.candidate.outputs.runtime_sha256 }}
        run: |
          set -euo pipefail
          set -C
          runtime="$RUNNER_TEMP/diagnostic-runtime/bin/aros"
          candidate="$RUNNER_TEMP/release-candidate"
          release="$candidate/release"
          subject="$candidate/subject-manifest.json"
          selection="$RUNNER_TEMP/native-release-evidence-selection.json"
          summary="$RUNNER_TEMP/release-candidate-summary.json"
          verified="$RUNNER_TEMP/verified-combined-provenance.json"
          final_index="$RUNNER_TEMP/final-combined-index.json"
          final_evidence="$RUNNER_TEMP/final-combined-evidence.json"
          for digest in "$EXPECTED_INDEX_SHA" "$EXPECTED_SUBJECT_SHA" "$EXPECTED_SELECTION_SHA" "$EXPECTED_SUMMARY_SHA" "$EXPECTED_INPUTS_SHA" "$EXPECTED_RUNTIME_SHA"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          check_sha() {
            local actual
            actual=$(shasum -a 256 "$1" | awk '{print $1}')
            [[ "$actual" == "$2" ]]
          }
          check_sha "$runtime" "$EXPECTED_RUNTIME_SHA"
          check_sha "$summary" "$EXPECTED_SUMMARY_SHA"
          check_sha "$selection" "$EXPECTED_SELECTION_SHA"
          check_sha "$release/toolchain-index-v2.json" "$EXPECTED_INDEX_SHA"
          check_sha "$subject" "$EXPECTED_SUBJECT_SHA"
          check_sha "$release/toolchain-release-inputs-v2.json" "$EXPECTED_INPUTS_SHA"
          # Reject oversized/nonregular input before hashing or external parsing.
          bundle_sha=$(python3 -B - "$PROVENANCE_BUNDLE" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys
          source = Path(sys.argv[1])
          if not source.is_absolute() or '..' in source.parts or source.resolve(strict=True) != source or any(parent.is_symlink() for parent in (source, *source.parents)):
              raise SystemExit('noncanonical provenance source')
          with os.fdopen(os.open(source, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as handle:
              before = os.fstat(handle.fileno())
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid != os.geteuid() or not 0 < before.st_size <= 16 * 1024 * 1024:
                  raise SystemExit('invalid provenance bundle file')
              raw = handle.read(16 * 1024 * 1024 + 1)
              after = os.fstat(handle.fileno())
          def fingerprint(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_uid, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
          if fingerprint(before) != fingerprint(after) or len(raw) != before.st_size:
              raise SystemExit('provenance source changed during bounded read')
          print(hashlib.sha256(raw).hexdigest())
          PY
          )
          bash scripts/toolchain/verify-provenance-attestation.sh \
            --subject-manifest "$subject" --subject-manifest-sha256 "$EXPECTED_SUBJECT_SHA" \
            --subject-dir "$release" --bundle "$PROVENANCE_BUNDLE" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/toolchain-release.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$verified"
