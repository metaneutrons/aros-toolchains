name: AROS Compiler and SDK Producer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select non-publishing qualification or packaging recovery
        required: true
        default: produce
        type: choice
        options:
          - produce
          - recover
          - qualify-v2
          - qualify-v2-full
      scope:
        description: Host tier; full requires non-publishing qualify-v2-full mode
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux
          - full
      source_run_id:
        description: Recovery only - qualified producer run ID
        required: false
        type: string
      diagnostic_group:
        description: qualify-v2 only - exact plan group ID; omit for all compiler groups
        required: false
        type: string
      source_tag:
        description: Recovery only - immutable source release tag in qualification evidence
        required: false
        type: string
      release_tag:
        description: Recovery only - new immutable release ID and tag
        required: false
        type: string
  push:
    tags:
      - v*

permissions:
  contents: read
  attestations: read

concurrency:
  group: toolchain-producer-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_LOCK: toolchains/llvm-11.0.0.sources.json
  COMPATIBILITY_PORTS_LOCK: toolchains/compatibility-ports-v3.json
  PROFILES: toolchains/profiles-v1.json
  LLVM_VERSION: 11.0.0
  PYTHONHASHSEED: "0"
  AROS_SOURCE_REPOSITORY: metaneutrons/AROS-NX
  AROS_SOURCE_COMMIT: 15230bef9d23e12cd9d4cca62253c4b62276e8ff
  TOOLS_RUNTIME_LOCK: toolchains/aros-tools-runtime-v1.json

jobs:
  v2-prepare:
    name: Prepare compiler and SDK qualification
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'qualify-v2' || inputs.mode == 'qualify-v2-full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    outputs:
      matrix: ${{ steps.matrix.outputs.verify_matrix }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      host_matrix: ${{ steps.matrix.outputs.host_matrix }}
      source_commit: ${{ steps.selection.outputs.source_commit }}
      tools_commit: ${{ steps.selection.outputs.tools_commit }}
      release_id: ${{ steps.selection.outputs.release_id }}
      runtime_kind: ${{ steps.selection.outputs.runtime_kind }}
      full_matrix: ${{ steps.selection.outputs.full_matrix }}
      prerelease: ${{ steps.selection.outputs.prerelease }}
      tag_object: ${{ steps.selection.outputs.tag_object }}
      tag_epoch: ${{ steps.selection.outputs.tag_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: selection
        name: Authenticate the exact route before source checkout or runtime materialization
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_GROUP: ${{ inputs.diagnostic_group }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/select-compiler-sdk-route-v2.py \
            --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" --source-ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --producer-commit "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-dir "$GITHUB_WORKSPACE" \
            --selection "$GITHUB_WORKSPACE/toolchains/compiler-sdk-ci-selection-v2.json" \
            --runtime-lock "$GITHUB_WORKSPACE/$TOOLS_RUNTIME_LOCK" \
            --mode "$REQUESTED_MODE" --scope "$REQUESTED_SCOPE" --group "$REQUESTED_GROUP" \
            --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ steps.selection.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ steps.selection.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - id: runtime_development
        if: steps.selection.outputs.runtime_kind == 'development'
        uses: ./.github/actions/materialize-development-aros-tools
        with:
          source-dir: ${{ github.workspace }}/dependencies/aros-tools
          commit: ${{ steps.selection.outputs.tools_commit }}
          destination: ${{ runner.temp }}/diagnostic-runtime
      - id: runtime_release
        if: steps.selection.outputs.runtime_kind == 'released'
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: linux-x86_64
          destination: ${{ runner.temp }}/diagnostic-runtime
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ steps.selection.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: linux-x86_64
      - id: runtime
        name: Bind the verified runtime root without fallback
        run: printf 'root=%s/diagnostic-runtime\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
      - name: Check the exact V2 interface before recipe preparation
        uses: ./.github/actions/check-v2-runtime-interface
        with:
          runtime-kind: ${{ steps.selection.outputs.runtime_kind }}
          root: ${{ steps.runtime.outputs.root }}
          tools-source: ${{ github.workspace }}/dependencies/aros-tools
          tools-commit: ${{ steps.selection.outputs.tools_commit }}
          output: ${{ runner.temp }}/diagnostic-runtime-interface.json
      - name: Retain preparation interface-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-runtime-interface-prepare
          path: ${{ runner.temp }}/diagnostic-runtime-interface.json
          if-no-files-found: error
          retention-days: 7
      - name: Fetch locked source-preflight seeds before offline admission
        id: product_source_seeds
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/diagnostic-source-seed-cache" "$RUNNER_TEMP/diagnostic-source-seed-logs"
          cp "$GITHUB_WORKSPACE/toolchains/source-seeds/chromium-zlib-da752eb2.tar.gz" \
            "$RUNNER_TEMP/diagnostic-source-seed-cache/zlib.tar.gz"
          timeout --signal=KILL 180s "${{ steps.runtime.outputs.root }}/bin/aros" cache sources fetch \
            --source-fetch-plan "$GITHUB_WORKSPACE/dependencies/aros/scripts/ci/product-sources.plan.json" \
            --dir "$RUNNER_TEMP/diagnostic-source-seed-cache" 2>&1 \
            | python3 -c '
          import sys
          remaining = 1048576
          for chunk in iter(lambda: sys.stdin.buffer.read(65536), b""):
              retained = chunk[:remaining]
              sys.stdout.buffer.write(retained)
              remaining -= len(retained)
          ' > "$RUNNER_TEMP/diagnostic-source-seed-logs/fetch.stdout.log"
      - id: source_preflight
        name: Check exact source contracts before compiler and SDK fan-out
        env:
          SELECTED_SOURCE_COMMIT: ${{ steps.selection.outputs.source_commit }}
        run: |
          set -euo pipefail
          aros_sha=$(jq -er '.runtime.sha256' "$RUNNER_TEMP/diagnostic-runtime-interface.json")
          python3 -B scripts/toolchain/check-compiler-sdk-source-preflight-v2.py \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
            --expected-commit "$SELECTED_SOURCE_COMMIT" \
            --aros "${{ steps.runtime.outputs.root }}/bin/aros" --aros-sha256 "$aros_sha" \
            --product-source-seed "$GITHUB_WORKSPACE/toolchains/source-seeds/chromium-zlib-da752eb2.tar.gz" \
            --mesa-source-seed "$RUNNER_TEMP/diagnostic-source-seed-cache/mesa-26.0.0.tar.xz" \
            --output-dir "$RUNNER_TEMP/diagnostic-source-preflight"
      - name: Retain bounded source preflight evidence including failures
        if: always() && steps.product_source_seeds.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-source-preflight
          path: |
            ${{ runner.temp }}/diagnostic-source-preflight/source-preflight-v2.json
            ${{ runner.temp }}/diagnostic-source-preflight/*.stdout.log
            ${{ runner.temp }}/diagnostic-source-preflight/*.stderr.log
            ${{ runner.temp }}/diagnostic-source-seed-logs/*.stdout.log
          if-no-files-found: error
          retention-days: 7
      - id: matrix
        name: Bind native recipes, source SDK identities and compiler/SDK selections
        env:
          REQUESTED_GROUP: ${{ inputs.diagnostic_group }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SELECTED_EVENT: ${{ steps.selection.outputs.event }}
          SELECTED_SCOPE: ${{ steps.selection.outputs.scope }}
          FULL_QUALIFICATION: ${{ steps.selection.outputs.full_qualification }}
        run: |
          set -euo pipefail
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          python3 -B scripts/toolchain/prepare-compiler-sdk-inputs-v2.py \
            --aros "${{ steps.runtime.outputs.root }}/bin/aros" \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
            --producer-dir "$producer" --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --selection "$producer/toolchains/compiler-sdk-ci-selection-v2.json" \
            --output-dir "$RUNNER_TEMP/diagnostic-inputs" \
            --projection-dir "$RUNNER_TEMP/diagnostic-source-projection"
          inputs_sha=$(sha256sum "$RUNNER_TEMP/diagnostic-inputs/toolchain-release-inputs-v2.json" | awk '{print $1}')
          plan_sha=$(sha256sum "$RUNNER_TEMP/diagnostic-inputs/plan.json" | awk '{print $1}')
          policy="$producer/toolchains/compiler-required-payload-v1.json"
          policy_sha=$(sha256sum "$policy" | awk '{print $1}')
          python3 -B scripts/toolchain/required-compiler-payload-v2.py \
            --policy "$policy" --policy-sha256 "$policy_sha" \
            --plan "$RUNNER_TEMP/diagnostic-inputs/plan.json" --plan-sha256 "$plan_sha" \
            --inputs-sha256 "$inputs_sha" --producer-commit "$GITHUB_SHA" \
            --tools-commit "${{ steps.selection.outputs.tools_commit }}" \
            > "$RUNNER_TEMP/diagnostic-required-paths.json"
          group_arguments=()
          if [[ "$FULL_QUALIFICATION" == true ]]; then
            group_arguments+=(--full-qualification)
          fi
          if [[ -n "$REQUESTED_GROUP" ]]; then
            group_arguments+=(--diagnostic-group "$REQUESTED_GROUP")
          fi
          python3 -B scripts/toolchain/select-release-matrix-v2.py \
            --plan "$RUNNER_TEMP/diagnostic-inputs/plan.json" --plan-sha256 "$plan_sha" \
            --inputs-sha256 "$inputs_sha" --producer-commit "$GITHUB_SHA" \
            --tools-commit "${{ steps.selection.outputs.tools_commit }}" \
            --event "$SELECTED_EVENT" --scope "$SELECTED_SCOPE" --github-output "$GITHUB_OUTPUT" \
            "${group_arguments[@]}" \
            > "$RUNNER_TEMP/diagnostic-inputs/matrix.json"
      - name: Retain independent required-payload selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-required-paths
          path: ${{ runner.temp }}/diagnostic-required-paths.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-runtime
          path: ${{ steps.runtime.outputs.root }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs/
          if-no-files-found: error
          retention-days: 7

  v2-sources:
    name: Prepare verified compiler and SDK sources
    needs: v2-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      cache_archive_sha256: ${{ steps.cache.outputs.cache_archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-runtime
          path: ${{ runner.temp }}/diagnostic-runtime
      - name: Select exact source-owned GNU regression code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
          path: dependencies/gnu-source-probe
          sparse-checkout: tools/crosstools/gnu
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: linux-x86_64
      - id: cache
        name: Verify runtime bytes and prepare every selected compiler/SDK cache
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          aros="$runtime/bin/aros"
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          cache="$RUNNER_TEMP/diagnostic-cache"
          mkdir "$cache"
          while IFS= read -r lock; do
            "$aros" cache sources fetch --source-lock "$producer/$lock" --dir "$cache"
            "$aros" cache sources fetch --source-lock "$producer/$lock" --dir "$cache" --offline
            "$aros" cache sources verify --source-lock "$producer/$lock" --dir "$cache"
            if [[ $(jq -r '.family' "$producer/$lock") == gnu ]]; then
              gcc_name=$(jq -er '[.sources[] | select(.component == "gcc")] | if length == 1 then .[0].filename else error("expected one locked GCC source") end' "$producer/$lock")
              [[ "$gcc_name" =~ ^[A-Za-z0-9._-]+$ && "$gcc_name" != . && "$gcc_name" != .. ]]
              gcc_sha=$(jq -er '.sources[] | select(.component == "gcc") | .sha256' "$producer/$lock")
              gcc_size=$(jq -er '.sources[] | select(.component == "gcc") | .size' "$producer/$lock")
              [[ $(sha256sum "$cache/$gcc_name" | awk '{print $1}') == "$gcc_sha" ]]
              [[ $(wc -c < "$cache/$gcc_name" | tr -d '[:space:]') == "$gcc_size" ]]
              source_probe="$GITHUB_WORKSPACE/dependencies/gnu-source-probe"
              [[ $(git -C "$source_probe" rev-parse HEAD) == "${{ needs.v2-prepare.outputs.source_commit }}" ]]
              # Keep only small diagnostic logs as artifacts, not extracted source/build trees.
              probe_logs="$RUNNER_TEMP/diagnostic-gnu-source-probe"
              mkdir -p "$probe_logs"
              printf 'gnu_probe_started=true\n' >> "$GITHUB_OUTPUT"
              TMPDIR="$probe_logs" AROS_KEEP_CODY_PROBE=1 \
                sh "$source_probe/tools/crosstools/gnu/tests/test-cody-srcdir.sh" "$cache/$gcc_name" \
                2>&1 | tee "$probe_logs/runner.log"
            fi
          done < <(jq -r '.groups[].source_lock' "$producer/toolchains/compiler-sdk-ci-selection-v2.json")
          while IFS= read -r lock; do
            bash scripts/toolchain/seed-compatibility-zlib.sh "$producer/$lock" "$cache" \
              "$producer/toolchains/source-seeds/chromium-zlib-da752eb2.tar.gz"
            for attempt in 1 2 3; do
              if "$aros" cache sources fetch --compatibility-ports-lock "$producer/$lock" --dir "$cache"; then break; fi
              [[ "$attempt" != 3 ]] || exit 1
              sleep "$((attempt * 10))"
            done
            "$aros" cache sources fetch --compatibility-ports-lock "$producer/$lock" --dir "$cache" --offline
            "$aros" cache sources verify --compatibility-ports-lock "$producer/$lock" --dir "$cache"
          done < <(jq -r '.groups[].ports_lock' "$producer/toolchains/compiler-sdk-ci-selection-v2.json" | sort -u)
          # Sources are host-independent; Cargo generations are prepared separately
          # with each host's exact native Cargo binary, never normalized across hosts.
          tar -C "$cache" -czf "$RUNNER_TEMP/diagnostic-cache.tar.gz" .
          archive_sha=$(sha256sum "$RUNNER_TEMP/diagnostic-cache.tar.gz" | awk '{print $1}')
          printf 'cache_archive_sha256=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"
      - name: Retain source-owned GNU probe logs
        if: always() && steps.cache.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-gnu-source-probe-logs
          path: |
            ${{ runner.temp }}/diagnostic-gnu-source-probe/runner.log
            ${{ runner.temp }}/diagnostic-gnu-source-probe/*/*.log
            ${{ runner.temp }}/diagnostic-gnu-source-probe/*/*.out
            ${{ runner.temp }}/diagnostic-gnu-source-probe/*/*.err
          if-no-files-found: ${{ steps.cache.outputs.gnu_probe_started == 'true' && 'error' || 'ignore' }}
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  v2-runtimes:
    name: Materialize selected native tools (${{ matrix.host }})
    needs: [v2-prepare, v2-sources]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.v2-prepare.outputs.host_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          persist-credentials: false
          path: dependencies/native-prerequisites
          sparse-checkout: scripts/ci/install-build-prerequisites.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache-input
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install source-owned native host prerequisites before fan-out
        run: bash dependencies/native-prerequisites/scripts/ci/install-build-prerequisites.sh
      - name: Select installed macOS LLVM tools before host preflight
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/select-macos-native-llvm.sh
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - id: runtime_development
        if: needs.v2-prepare.outputs.runtime_kind == 'development'
        uses: ./.github/actions/materialize-development-aros-tools
        with:
          source-dir: ${{ github.workspace }}/dependencies/aros-tools
          commit: ${{ needs.v2-prepare.outputs.tools_commit }}
          destination: ${{ runner.temp }}/diagnostic-runtime
      - id: runtime_release
        if: needs.v2-prepare.outputs.runtime_kind == 'released'
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: ${{ matrix.host }}
          destination: ${{ runner.temp }}/diagnostic-runtime
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: ${{ matrix.host }}
      - id: runtime
        name: Bind the verified runtime root without fallback
        run: printf 'root=%s/diagnostic-runtime\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
      - name: Check every selected host V2 interface before compiler fan-out
        uses: ./.github/actions/check-v2-runtime-interface
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ steps.runtime.outputs.root }}
          tools-source: ${{ github.workspace }}/dependencies/aros-tools
          tools-commit: ${{ needs.v2-prepare.outputs.tools_commit }}
          output: ${{ runner.temp }}/diagnostic-native-runtime-interface-${{ matrix.host }}.json
      - name: Retain selected host interface-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-runtime-interface-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-native-runtime-interface-${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 7
      - id: host_preflight
        name: Check every selected native profile before compiler fan-out
        env:
          SELECTED_HOST: ${{ matrix.host }}
          SELECTED_LANES: ${{ needs.v2-prepare.outputs.matrix }}
          CACHE_ARCHIVE_SHA256: ${{ needs.v2-sources.outputs.cache_archive_sha256 }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cache-input/diagnostic-cache.tar.gz" \
            --archive-sha256 "$CACHE_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/host-preflight-cache"
          python3 -B scripts/toolchain/check-native-host-preflights-v2.py \
            --aros "${{ steps.runtime.outputs.root }}/bin/aros" \
            --aros-sha256 "$(jq -er '.runtime.sha256' "$RUNNER_TEMP/diagnostic-native-runtime-interface-$SELECTED_HOST.json")" \
            --selected-matrix "$SELECTED_LANES" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" \
            --cache-dir "$RUNNER_TEMP/host-preflight-cache" --host "$SELECTED_HOST" \
            --output-dir "$RUNNER_TEMP/native-host-preflights"
      - name: Retain bounded native prerequisite observations, never Python environments
        if: always() && steps.host_preflight.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-host-preflights-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/native-host-preflights/*.json
            ${{ runner.temp }}/native-host-preflights/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Prepare and seal this host's exact Cargo generation
        env:
          SELECTED_HOST: ${{ matrix.host }}
          SELECTED_TOOLS_COMMIT: ${{ needs.v2-prepare.outputs.tools_commit }}
          SELECTED_CARGO: ${{ steps.rust.outputs.cargo }}
        run: |
          set -euo pipefail
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          cache="$RUNNER_TEMP/native-cargo-cache"
          mkdir "$cache"
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          "$aros" cache cargo fetch --producer-dir "$producer" --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --dir "$cache" --cargo "$SELECTED_CARGO"
          "$aros" cache cargo fetch --producer-dir "$producer" --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --dir "$cache" --cargo "$SELECTED_CARGO" --offline
          "$aros" cache cargo verify --producer-dir "$producer" --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --dir "$cache" --cargo "$SELECTED_CARGO"
          # Preserve modes and empty directories inside the native generation.
          COPYFILE_DISABLE=1 tar -C "$cache/cargo" -czf "$RUNNER_TEMP/native-cargo-cache.tar.gz" .
          mkdir "$RUNNER_TEMP/native-cargo-identity"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with (root / 'native-cargo-cache.tar.gz').open('rb') as handle:
              digest = hashlib.file_digest(handle, 'sha256').hexdigest()
          host = os.environ['SELECTED_HOST']
          identity = {
              'schema': 'aros-native-cargo-cache-v1',
              'host': host,
              'producer_commit': os.environ['GITHUB_SHA'],
              'tools_commit': os.environ['SELECTED_TOOLS_COMMIT'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'archive_sha256': digest,
          }
          with (root / 'native-cargo-identity' / f'{host}.json').open('x') as handle:
              json.dump(identity, handle, sort_keys=True)
              handle.write('\n')
          PY
      - name: Retain native Cargo archive without permission normalization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-cargo-cache-${{ matrix.host }}
          path: ${{ runner.temp }}/native-cargo-cache.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain native Cargo transport identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-cargo-identity-${{ matrix.host }}
          path: ${{ runner.temp }}/native-cargo-identity/${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-native-runtime-${{ matrix.host }}
          path: ${{ steps.runtime.outputs.root }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  v2-cargo-catalog:
    name: Bind every selected native Cargo cache
    needs: [v2-prepare, v2-runtimes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cache_archives: ${{ steps.catalog.outputs.cache_archives }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: diagnostic-v2-cargo-identity-*
          path: ${{ runner.temp }}/native-cargo-identities
          merge-multiple: false
      - id: catalog
        name: Require exact host, commit and run identity without matrix-output races
        env:
          SELECTED_HOST_MATRIX: ${{ needs.v2-prepare.outputs.host_matrix }}
          SELECTED_TOOLS_COMMIT: ${{ needs.v2-prepare.outputs.tools_commit }}
        run: |
          set -euo pipefail
          python3 -B scripts/toolchain/collect-native-cargo-caches-v2.py \
            --identity-dir "$RUNNER_TEMP/native-cargo-identities" \
            --host-matrix "$SELECTED_HOST_MATRIX" --producer-commit "$GITHUB_SHA" \
            --tools-commit "$SELECTED_TOOLS_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"

  v2-build:
    name: Native compiler (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }}, ${{ matrix.copy }})
    if: needs.v2-prepare.outputs.full_matrix == 'true'
    needs: [v2-prepare, v2-sources, v2-runtimes, v2-cargo-catalog]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.v2-prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cargo-cache-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-cargo-input
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install native compiler prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Select installed macOS LLVM tools
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/select-macos-native-llvm.sh
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: ${{ matrix.host }}
      - id: lane
        name: Select the exact original compiler lane
        env:
          SELECTED_GROUP: ${{ matrix.group_id }}
          SELECTED_HOST: ${{ matrix.host }}
          SELECTED_PRESET: ${{ matrix.profile }}
          SELECTED_COPY: ${{ matrix.copy }}
          SELECTED_RELEASE_ID: ${{ needs.v2-prepare.outputs.release_id }}
          CACHE_ARCHIVE_SHA256: ${{ needs.v2-sources.outputs.cache_archive_sha256 }}
          CARGO_ARCHIVE_SHA256: ${{ fromJSON(needs.v2-cargo-catalog.outputs.cache_archives)[matrix.host] }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cache-input/diagnostic-cache.tar.gz" \
            --archive-sha256 "$CACHE_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cargo-input/native-cargo-cache.tar.gz" \
            --archive-sha256 "$CARGO_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache/cargo"
          "$runtime/bin/aros" cache cargo verify --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --dir "$RUNNER_TEMP/diagnostic-cache" \
            --cargo "${{ steps.rust.outputs.cargo }}"
          inputs="$RUNNER_TEMP/diagnostic-inputs"
          inputs_sha=$(shasum -a 256 "$inputs/toolchain-release-inputs-v2.json" | awk '{print $1}')
          "$runtime/bin/aros" toolchain producer release-plan --directory "$inputs" \
            --inputs-sha256 "$inputs_sha" --format json > "$RUNNER_TEMP/build-plan.json"
          jq -e --arg group "$SELECTED_GROUP" --arg host "$SELECTED_HOST" --arg profile "$SELECTED_PRESET" \
            'any(.lanes[]; .group_id == $group and .host == $host and .target_profile == $profile)' \
            "$RUNNER_TEMP/build-plan.json" >/dev/null
          group=$(jq -ce --arg group "$SELECTED_GROUP" '.groups | map(select(.group_id == $group)) | if length == 1 then .[0] else error("ambiguous group") end' "$RUNNER_TEMP/build-plan.json")
          recipe_file=$(jq -er '.recipe.file' <<< "$group")
          lock_file=$(jq -er '.source_lock.file' <<< "$group")
          profiles_file=$(jq -er '.profiles.file' <<< "$group")
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          {
            printf 'recipe=%s/%s\n' "$inputs" "$recipe_file"
            printf 'lock=%s/%s\n' "$inputs" "$lock_file"
            printf 'profiles=%s/%s\n' "$inputs" "$profiles_file"
            printf 'runtime-sha256=%s\n' "$runtime_sha"
            printf 'release-id=%s\n' "$SELECTED_RELEASE_ID"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-native-lane-v2
        with:
          aros: ${{ runner.temp }}/diagnostic-runtime/bin/aros
          aros-sha256: ${{ steps.lane.outputs.runtime-sha256 }}
          recipe: ${{ steps.lane.outputs.recipe }}
          source-lock: ${{ steps.lane.outputs.lock }}
          profiles: ${{ steps.lane.outputs.profiles }}
          source-dir: ${{ github.workspace }}/dependencies/aros
          producer-dir: ${{ runner.temp }}/diagnostic-producer
          tools-dir: ${{ github.workspace }}/dependencies/aros-tools
          cache-dir: ${{ runner.temp }}/diagnostic-cache
          group: ${{ matrix.group_id }}
          preset: ${{ matrix.profile }}
          host: ${{ matrix.host }}
          copy: ${{ matrix.copy }}
          release-id: ${{ steps.lane.outputs.release-id }}
          jobs: '3'
          timeout-seconds: '20000'
          root: ${{ runner.temp }}/native-lane-${{ matrix.copy }}
          workflow: .github/workflows/toolchain-release.yml
          job-name: Native compiler (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }}, ${{ matrix.copy }})
      - name: Retain native owner failure diagnostics outside the signed payload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-native-${{ matrix.group_id }}-${{ matrix.host }}-${{ matrix.profile }}-${{ matrix.copy }}
          path: |
            ${{ runner.temp }}/native-lane-${{ matrix.copy }}/work/native-lifecycle/logs/
            ${{ runner.temp }}/native-lane-${{ matrix.copy }}/work/native-lifecycle/receipts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  v2-sdk:
    name: SDK from owned compilers (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }})
    if: needs.v2-prepare.outputs.full_matrix == 'true'
    needs: [v2-prepare, v2-sources, v2-runtimes, v2-cargo-catalog, v2-build]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.v2-prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/upstream-aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cargo-cache-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-cargo-input
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install native SDK consumer prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Select installed macOS LLVM tools
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/select-macos-native-llvm.sh
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: ${{ matrix.host }}
      - id: sdk
        name: Authenticate both original compilers before comparison and SDK generation
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_GROUP: ${{ matrix.group_id }}
          SELECTED_HOST: ${{ matrix.host }}
          SELECTED_PRESET: ${{ matrix.profile }}
          CURRENT_JOB: SDK from owned compilers (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }})
          SELECTED_RELEASE_ID: ${{ needs.v2-prepare.outputs.release_id }}
          CACHE_ARCHIVE_SHA256: ${{ needs.v2-sources.outputs.cache_archive_sha256 }}
          CARGO_ARCHIVE_SHA256: ${{ fromJSON(needs.v2-cargo-catalog.outputs.cache_archives)[matrix.host] }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cache-input/diagnostic-cache.tar.gz" \
            --archive-sha256 "$CACHE_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cargo-input/native-cargo-cache.tar.gz" \
            --archive-sha256 "$CARGO_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache/cargo"
          "$runtime/bin/aros" cache cargo verify --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --dir "$RUNNER_TEMP/diagnostic-cache" \
            --cargo "${{ steps.rust.outputs.cargo }}"
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'compiler-owner-selectors'
          root.mkdir(mode=0o700)
          context = origin.context_from_environment('.github/workflows/toolchain-release.yml')
          with (root / 'context.json').open('xb') as handle:
              handle.write(origin.canonical(context))
          PY
          selectors="$RUNNER_TEMP/compiler-owner-selectors"
          context_sha=$(shasum -a 256 "$selectors/context.json" | awk '{print $1}')
          for copy in a b; do
            lane_sha=$(printf '%s\0' "$SELECTED_GROUP" "$SELECTED_HOST" "$SELECTED_PRESET" "$copy" | shasum -a 256 | awk '{print $1}')
            python3 -B scripts/toolchain/select-owner-artifacts-v2.py \
              --source-context "$selectors/context.json" --source-context-sha256 "$context_sha" \
              --job-name "Native compiler ($SELECTED_GROUP, $SELECTED_HOST, $SELECTED_PRESET, $copy)" \
              --payload-name "native-v2-$lane_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --proof-name "native-v2-proof-$lane_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --role build --group "$SELECTED_GROUP" --host "$SELECTED_HOST" \
              --profile="$SELECTED_PRESET" --copy "$copy" > "$selectors/$copy.json"
          done
          jq -se 'length == 2 and .[0].job.id != .[1].job.id' \
            "$selectors/a.json" "$selectors/b.json" >/dev/null
          bash scripts/toolchain/qualify-compiler-sdk-lane-v2.sh \
            --aros "$runtime/bin/aros" --runtime-sha256 "$runtime_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" \
            --selection "$producer/toolchains/compiler-sdk-ci-selection-v2.json" \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --cache-dir "$RUNNER_TEMP/diagnostic-cache" \
            --upstream-source-dir "$GITHUB_WORKSPACE/dependencies/upstream-aros" \
            --group "$SELECTED_GROUP" --preset "$SELECTED_PRESET" --host "$SELECTED_HOST" \
            --owner-a-selection "$selectors/a.json" --owner-b-selection "$selectors/b.json" \
            --source-workflow .github/workflows/toolchain-release.yml --source-ref "$GITHUB_REF" \
            --release-id "$SELECTED_RELEASE_ID" \
            --workflow .github/workflows/toolchain-release.yml --job-name "$CURRENT_JOB" --same-attempt \
            --root "$RUNNER_TEMP/owned-sdk-lane" --jobs 3 --timeout-seconds 20000
          sdk_ids=$(jq -cse '[.[].id] | sort | if length > 0 and . == unique then . else error("invalid SDK lane selection") end' \
            "$RUNNER_TEMP/owned-sdk-lane/sdk-selections.jsonl")
          printf 'sdk-ids=%s\n' "$sdk_ids" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/retain-sdk-owner-payload-v2
        with:
          operation-root: ${{ runner.temp }}/owned-sdk-lane
          sdk-ids: ${{ steps.sdk.outputs.sdk-ids }}
          group: ${{ matrix.group_id }}
          preset: ${{ matrix.profile }}
          host: ${{ matrix.host }}
          owner-role: sdk
          root: ${{ runner.temp }}/owned-sdk-origin
          workflow: .github/workflows/toolchain-release.yml
          job-name: SDK from owned compilers (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }})
      - name: Retain SDK owner readback and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-owned-sdk-${{ matrix.group_id }}-${{ matrix.host }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/compiler-owner-selectors/
            ${{ runner.temp }}/owned-sdk-lane/*.json
            ${{ runner.temp }}/owned-sdk-lane/compiler-*/observation.json
            ${{ runner.temp }}/owned-sdk-lane/compiler-*/native-verification.json
            ${{ runner.temp }}/owned-sdk-lane/compiler-*/origin-verification.log
            ${{ runner.temp }}/owned-sdk-lane/sdk-*/result.json
            ${{ runner.temp }}/owned-sdk-lane/sdk-*/generation.json
            ${{ runner.temp }}/owned-sdk-lane/sdk-*/reports/
            ${{ runner.temp }}/owned-sdk-lane/sdk-*/cmake/**/*.log
            ${{ runner.temp }}/owned-sdk-lane/sdk-*/cmake/**/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  v2-readback:
    name: Read back original compiler and SDK owners
    if: needs.v2-prepare.outputs.full_matrix == 'true'
    needs: [v2-prepare, v2-runtimes, v2-build, v2-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
      # This job also signs only the closed combined diagnostic candidate.
      # It cannot create tags, drafts or releases (contents remains read-only).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-linux-x86_64
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          persist-credentials: false
          path: dependencies/aros-tools-fixtures
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: linux-x86_64
      - name: Authenticate the complete SDK owner matrix
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TOOLS: ${{ needs.v2-prepare.outputs.tools_commit }}
          SELECTED_RELEASE_ID: ${{ needs.v2-prepare.outputs.release_id }}
          CURRENT_JOB: Read back original compiler and SDK owners
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('origin', 'scripts/toolchain/artifact-origin.py')
          origin = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(origin)
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'sdk-owner-context'
          root.mkdir(mode=0o700)
          with (root / 'context.json').open('xb') as handle:
              handle.write(origin.canonical(origin.context_from_environment('.github/workflows/toolchain-release.yml')))
          PY
          context="$RUNNER_TEMP/sdk-owner-context/context.json"
          context_sha=$(shasum -a 256 "$context" | awk '{print $1}')
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          inputs_sha=$(shasum -a 256 "$RUNNER_TEMP/diagnostic-inputs/toolchain-release-inputs-v2.json" | awk '{print $1}')
          bash scripts/toolchain/collect-compiler-owners-v2.sh \
