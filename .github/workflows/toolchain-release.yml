          check_sha "$PROVENANCE_BUNDLE" "$bundle_sha"
          python3 -B - "$PROVENANCE_BUNDLE" "$release/toolchain-provenance.sigstore.json" "$bundle_sha" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys
          source, target, expected = sys.argv[1:]
          for selected in (Path(source), Path(target).parent):
              if not selected.is_absolute() or '..' in selected.parts or selected.resolve(strict=True) != selected or any(parent.is_symlink() for parent in (selected, *selected.parents)):
                  raise SystemExit('noncanonical provenance path')
          def fingerprint(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_uid, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
          flags = os.O_RDONLY | os.O_NOFOLLOW
          with os.fdopen(os.open(source, flags), 'rb') as handle:
              before = os.fstat(handle.fileno())
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid != os.geteuid() or not 0 < before.st_size <= 16 * 1024 * 1024:
                  raise SystemExit('invalid provenance bundle file')
              raw = handle.read(16 * 1024 * 1024 + 1)
              after = os.fstat(handle.fileno())
          if fingerprint(before) != fingerprint(after) or len(raw) != before.st_size or hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('provenance bundle changed during copy')
          with os.fdopen(os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600), 'wb') as handle:
              handle.write(raw)
              handle.flush()
              os.fsync(handle.fileno())
          PY
          bash scripts/toolchain/verify-provenance-attestation.sh \
            --subject-manifest "$subject" --subject-manifest-sha256 "$EXPECTED_SUBJECT_SHA" \
            --subject-dir "$release" --bundle "$release/toolchain-provenance.sigstore.json" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/toolchain-release.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/verified-staged-combined-provenance.json"
          check_sha "$runtime" "$EXPECTED_RUNTIME_SHA"
          (ulimit -f 8192; timeout --signal=KILL 3600 "$runtime" toolchain producer index \
            --directory "$release" --release-id "$SELECTED_RELEASE_ID" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$SELECTED_RELEASE_ID" \
            --release-format family-v2 --lane-inputs "$candidate/lane-inputs.json" \
            --subject-manifest "$subject" --subject-manifest-sha256 "$EXPECTED_SUBJECT_SHA" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --stage final --format json) > "$final_index" 2> "$RUNNER_TEMP/final-combined-index.stderr.log"
          check_sha "$runtime" "$EXPECTED_RUNTIME_SHA"
          check_sha "$selection" "$EXPECTED_SELECTION_SHA"
          (ulimit -f 8192; timeout --signal=KILL 5400 "$runtime" toolchain producer verify-release-evidence \
            --directory "$release" --release-id "$SELECTED_RELEASE_ID" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$SELECTED_RELEASE_ID" \
            --inputs-sha256 "$EXPECTED_INPUTS_SHA" --index-sha256 "$EXPECTED_INDEX_SHA" \
            --selection "$selection" --selection-sha256 "$EXPECTED_SELECTION_SHA" \
            --subject-manifest "$subject" --subject-manifest-sha256 "$EXPECTED_SUBJECT_SHA" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --format json) > "$final_evidence" 2> "$RUNNER_TEMP/final-combined-evidence.stderr.log"
          check_sha "$runtime" "$EXPECTED_RUNTIME_SHA"
          check_sha "$summary" "$EXPECTED_SUMMARY_SHA"
          check_sha "$selection" "$EXPECTED_SELECTION_SHA"
          check_sha "$release/toolchain-index-v2.json" "$EXPECTED_INDEX_SHA"
          check_sha "$subject" "$EXPECTED_SUBJECT_SHA"
          checksums_sha=$(shasum -a 256 "$release/SHA256SUMS" | awk '{print $1}')
          staged_bundle_sha=$(shasum -a 256 "$release/toolchain-provenance.sigstore.json" | awk '{print $1}')
          staged_bundle_size=$(wc -c < "$release/toolchain-provenance.sigstore.json" | tr -d '[:space:]')
          [[ "$staged_bundle_sha" == "$bundle_sha" ]]
          jq -e --arg index "$EXPECTED_INDEX_SHA" --arg subject "$EXPECTED_SUBJECT_SHA" \
            --arg release_id "$SELECTED_RELEASE_ID" --arg index_path "$release/toolchain-index-v2.json" \
            --arg subject_path "$subject" --arg checksums_path "$release/SHA256SUMS" \
            --arg checksums "$checksums_sha" --arg provenance "$staged_bundle_sha" \
            --argjson provenance_size "$staged_bundle_size" \
            --slurpfile summary "$summary" '
            .schema == "aros-toolchain-producer-stage-v2" and .operation == "index" and
            .release_format == "family-v2" and .stage == "final" and
            .release_id == $release_id and .index == $index_path and .subject_manifest == $subject_path and
            .index_sha256 == $index and .subject_manifest_sha256 == $subject and
            .checksums == $checksums_path and .checksums_sha256 == $checksums and .provenance_sha256 == $provenance and
            .provenance_size == $provenance_size and
            .subject_manifest_size == $summary[0].outputs.subject_manifest.size and
            .subject_count == $summary[0].counts.subject_count and
            .inventory_count == $summary[0].counts.inventory_count and
            .lane_count == $summary[0].counts.lane_count and .sdk_count == $summary[0].counts.sdk_count
          ' "$final_index" >/dev/null
          jq -e --arg inputs "$EXPECTED_INPUTS_SHA" --arg index "$EXPECTED_INDEX_SHA" \
            --arg selection "$EXPECTED_SELECTION_SHA" --arg subject "$EXPECTED_SUBJECT_SHA" \
            --arg release_id "$SELECTED_RELEASE_ID" --arg checksums "$checksums_sha" --arg provenance "$staged_bundle_sha" \
            --slurpfile summary "$summary" --slurpfile selected "$selection" '
            .schema == "aros-toolchain-producer-stage-v2" and .operation == "verify-release-evidence" and
            .release_format == "family-v2" and .assurance == "byte-consistency-only" and
            .release_id == $release_id and .checksums_sha256 == $checksums and .provenance_sha256 == $provenance and
            .inputs_sha256 == $inputs and .index_sha256 == $index and
            .selection_sha256 == $selection and .subject_manifest_sha256 == $subject and
            .lane_count == $summary[0].counts.lane_count and .build_count == (.lane_count * 2) and
            (.lanes | length) == .lane_count and .sdk_count == $summary[0].counts.sdk_count and
            (.sdks | length) == .sdk_count and
            .sdk_generation_count == ($selected[0].sdk_generations | length) and
            (.sdk_generations | length) == .sdk_generation_count and
            ([.lanes[].asset] | sort) == ($selected[0].lanes | keys | sort) and
            ([.sdks[].sdk_id] | sort) == ($selected[0].sdk_packages | keys | sort) and
            ([.sdk_generations[] | [.sdk_id,.group_id,.target_profile,.host]] | sort) ==
              ([$selected[0].sdk_generations[] | [.sdk_id,.group_id,.target_profile,.host]] | sort) and
            all(.lanes[]; . as $lane | $selected[0].lanes[$lane.asset] as $expected |
              $lane.comparison_sha256 == $expected.comparison.sha256 and
              $lane.compatibility_inputs_sha256 == $expected.compatibility.inputs.sha256 and
              $lane.compatibility_manifest_sha256 == $expected.compatibility.manifest_sha256) and
            all(.sdks[]; . as $sdk | $selected[0].sdk_packages[$sdk.sdk_id] as $expected |
              $sdk.tree_sha256 == $expected.tree_sha256 and $sdk.archive_sha256 == $expected.archive_sha256 and
              $sdk.archive_size == $expected.archive_size) and
            all(.sdk_generations[]; . as $generation |
              any($selected[0].sdk_generations[]; .sdk_id == $generation.sdk_id and .group_id == $generation.group_id and
                .target_profile == $generation.target_profile and .host == $generation.host and
                .record.sha256 == $generation.generation_record_sha256 and
                .compatibility.manifest_sha256 == $generation.compatibility_manifest_sha256))
          ' "$final_evidence" >/dev/null
          # Byte readback is not publication permission. Only a separately
          # authenticated product-tag route may record complete qualification.
      - name: Record complete tag-bound V2 qualification
        id: complete-qualification
        if: github.event_name == 'push' && needs.v2-prepare.outputs.runtime_kind == 'released'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TAG_OBJECT: ${{ needs.v2-prepare.outputs.tag_object }}
          SELECTED_RELEASE_ID: ${{ needs.v2-prepare.outputs.release_id }}
          EXPECTED_INDEX_SHA: ${{ steps.candidate.outputs.index_sha256 }}
          EXPECTED_SUBJECT_SHA: ${{ steps.candidate.outputs.subject_sha256 }}
          EXPECTED_SELECTION_SHA: ${{ steps.candidate.outputs.selection_sha256 }}
          EXPECTED_SUMMARY_SHA: ${{ steps.candidate.outputs.summary_sha256 }}
          EXPECTED_INPUTS_SHA: ${{ steps.candidate.outputs.inputs_sha256 }}
          EXPECTED_RUNTIME_SHA: ${{ steps.candidate.outputs.runtime_sha256 }}
        run: |
          set -euo pipefail
          set -C
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/tags/$SELECTED_RELEASE_ID" && "$SELECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          route="$RUNNER_TEMP/qualification-route.env"
          test ! -e "$route" && test ! -L "$route"
          python3 -B scripts/toolchain/select-compiler-sdk-route-v2.py \
            --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" --source-ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --producer-commit "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --producer-dir "$GITHUB_WORKSPACE" \
            --selection "$GITHUB_WORKSPACE/toolchains/compiler-sdk-ci-selection-v2.json" \
            --runtime-lock "$GITHUB_WORKSPACE/$TOOLS_RUNTIME_LOCK" --github-output "$route"
          grep -Fx "tag_object=$SELECTED_TAG_OBJECT" "$route" >/dev/null
          grep -Fx "release_id=$SELECTED_RELEASE_ID" "$route" >/dev/null
          grep -Fx 'runtime_kind=released' "$route" >/dev/null
          # Recording must be outside both forbidden build roots. This small
          # runner-owned directory is evidence only, never a new build tree.
          parent=$(mktemp -d "$HOME/aros-v2-qualification.XXXXXX")
          parent=$(cd "$parent" && pwd -P)
          operation="$parent/record"
          summary="$parent/record-result.json"
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          python3 -B scripts/toolchain/materialize-aros-tools-runtime.py verify \
            --lock "$GITHUB_WORKSPACE/$TOOLS_RUNTIME_LOCK" --host linux-x86_64 --directory "$runtime"
          created=$(date +%s)
          expires=$((created + 7 * 24 * 60 * 60))
          python3 -B scripts/toolchain/record-complete-qualification-v2.py \
            --runtime "$runtime/bin/aros" --runtime-sha256 "$EXPECTED_RUNTIME_SHA" \
            --release-dir "$RUNNER_TEMP/release-candidate/release" \
            --inputs-sha256 "$EXPECTED_INPUTS_SHA" --index-sha256 "$EXPECTED_INDEX_SHA" \
            --selection "$RUNNER_TEMP/native-release-evidence-selection.json" --selection-sha256 "$EXPECTED_SELECTION_SHA" \
            --subject-manifest "$RUNNER_TEMP/release-candidate/subject-manifest.json" --subject-manifest-sha256 "$EXPECTED_SUBJECT_SHA" \
            --candidate-summary "$RUNNER_TEMP/release-candidate-summary.json" --candidate-summary-sha256 "$EXPECTED_SUMMARY_SHA" \
            --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/toolchain-release.yml \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-tag "$SELECTED_RELEASE_ID" --source-tag-object "$SELECTED_TAG_OBJECT" --source-tag-commit "$GITHUB_SHA" \
            --created-at "$created" --expires-at "$expires" --operation-dir "$operation" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" > "$summary"
          evidence="$operation/qualification-evidence-v2.json"
          evidence_sha=$(shasum -a 256 "$evidence" | awk '{print $1}')
          jq -e --arg path "$evidence" --arg digest "$evidence_sha" --arg tag "$SELECTED_RELEASE_ID" \
            --arg object "$SELECTED_TAG_OBJECT" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            .schema == "aros-toolchain-full-qualification-record-adapter-v2" and
            .operation == "record-full-qualification" and
            .qualification_evidence == {path: $path, sha256: $digest} and
            .source_observation.tag == $tag and .source_observation.tag_object == $object and
            .source_observation.peeled_commit == $commit and
            (.source_observation.run_id | tostring) == $run and
            (.source_observation.run_attempt | tostring) == $attempt and
            .scope.publication == false
          ' "$summary" >/dev/null
          printf 'evidence=%s\nevidence_sha256=%s\n' "$evidence" "$evidence_sha" >> "$GITHUB_OUTPUT"
      - name: Attest the unchanged complete qualification record
        id: qualification-signature
        if: github.event_name == 'push' && steps.complete-qualification.outcome == 'success'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ steps.complete-qualification.outputs.evidence }}
      - name: Seal qualification transport metadata
        if: github.event_name == 'push' && steps.qualification-signature.outcome == 'success'
        env:
          QUALIFICATION_PARENT: ${{ steps.complete-qualification.outputs.parent }}
          QUALIFICATION_PATH: ${{ steps.complete-qualification.outputs.evidence }}
          QUALIFICATION_SHA: ${{ steps.complete-qualification.outputs.evidence_sha256 }}
          QUALIFICATION_BUNDLE: ${{ steps.qualification-signature.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('qualification', 'scripts/toolchain/record-complete-qualification-v2.py')
          qualification = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(qualification)
          parent = Path(os.environ['QUALIFICATION_PARENT'])
          evidence = Path(os.environ['QUALIFICATION_PATH'])
          measurement, _, fingerprint = qualification._read_owned(evidence, qualification.MAX_METADATA, 'qualification record')
          if measurement['sha256'] != os.environ['QUALIFICATION_SHA']:
              raise SystemExit('qualification record changed during attestation')
          for source, name in (
              (Path(os.environ['QUALIFICATION_BUNDLE']), 'qualification.sigstore.json'),
              (Path(os.environ['RUNNER_TEMP']) / 'qualification-route.env', 'qualification-route.env'),
          ):
              selected, data, identity = qualification._read_owned(source, qualification.MAX_METADATA, name)
              with (parent / name).open('xb') as output:
                  output.write(data)
              qualification._stat_expected(source, qualification.MAX_METADATA, name, selected, identity)
          qualification._stat_expected(evidence, qualification.MAX_METADATA, 'qualification record', measurement, fingerprint)
          PY
      - name: Retain complete qualification and its signed provenance
        if: github.event_name == 'push' && steps.qualification-signature.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-v2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.complete-qualification.outputs.parent }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded qualification failure diagnostics
        if: failure() && steps.complete-qualification.outputs.parent != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-v2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.complete-qualification.outputs.parent }}/
            ${{ runner.temp }}/qualification-route.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostic selection metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-sdk-owner-selection
          path: |
            ${{ runner.temp }}/sdk-owner-context/
            ${{ runner.temp }}/sdk-index-native-plan.json
            ${{ runner.temp }}/sdk-package-inputs.json
            ${{ runner.temp }}/compiler-candidate-required-paths.json
            ${{ runner.temp }}/release-candidate-summary.json
            ${{ runner.temp }}/native-release-evidence-selection.json
            ${{ runner.temp }}/verified-combined-provenance.json
            ${{ runner.temp }}/verified-staged-combined-provenance.json
            ${{ runner.temp }}/final-combined-index.json
            ${{ runner.temp }}/final-combined-index.stderr.log
            ${{ runner.temp }}/final-combined-evidence.json
            ${{ runner.temp }}/final-combined-evidence.stderr.log
            ${{ runner.temp }}/release-candidate/lane-inputs.json
            ${{ runner.temp }}/release-candidate/subject-manifest.json
            ${{ runner.temp }}/release-candidate/release/toolchain-index-v2.json
            ${{ runner.temp }}/release-candidate/compiler-stage/compiler-index-lanes.json
            ${{ runner.temp }}/release-candidate/compiler-stage/compiler-evidence-fragment.json
            ${{ runner.temp }}/release-candidate/compiler-stage/reports/
            ${{ runner.temp }}/release-candidate/compiler-stage/native/
            ${{ runner.temp }}/release-candidate/sdk-stage/native/
            ${{ runner.temp }}/release-candidate/native/
            ${{ runner.temp }}/complete-compiler-readback/matrix.json
            ${{ runner.temp }}/complete-compiler-readback/selection-fragment.json
            ${{ runner.temp }}/complete-compiler-readback/owners/*/selection.json
            ${{ runner.temp }}/complete-compiler-readback/owners/*/readback/observation.json
            ${{ runner.temp }}/complete-compiler-readback/owners/*/readback/origin-verification.log
            ${{ runner.temp }}/complete-sdk-readback/matrix.json
            ${{ runner.temp }}/complete-sdk-readback/selection-fragment.json
            ${{ runner.temp }}/complete-sdk-readback/owners/*/selection.json
            ${{ runner.temp }}/complete-sdk-readback/owners/*/readback/readback.json
            ${{ runner.temp }}/complete-sdk-readback/owners/*/readback/origin-verification.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  v2-qualify:
    name: Compiler A/B and SDK (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }})
    if: inputs.mode == 'qualify-v2'
    needs: [v2-prepare, v2-sources, v2-runtimes, v2-cargo-catalog]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.v2-prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: metaneutrons/AROS-NX
          ref: ${{ needs.v2-prepare.outputs.source_commit }}
          fetch-depth: 0
          path: dependencies/upstream-aros
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaneutrons/aros-tools
          ref: ${{ needs.v2-prepare.outputs.tools_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: dependencies/aros-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-native-runtime-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-inputs
          path: ${{ runner.temp }}/diagnostic-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cache
          path: ${{ runner.temp }}/diagnostic-cache-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: diagnostic-v2-cargo-cache-${{ matrix.host }}
          path: ${{ runner.temp }}/diagnostic-cargo-input
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install compiler and SDK consumer prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Select installed macOS LLVM tools
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/select-macos-native-llvm.sh
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ github.workspace }}
      - uses: ./.github/actions/verify-aros-tools-runtime-transport
        with:
          runtime-kind: ${{ needs.v2-prepare.outputs.runtime_kind }}
          root: ${{ runner.temp }}/diagnostic-runtime
          host: ${{ matrix.host }}
      - id: qualify
        name: Execute fresh native compiler A/B and source-bound SDK qualification
        env:
          SELECTED_GROUP: ${{ matrix.group_id }}
          SELECTED_PRESET: ${{ matrix.profile }}
          SELECTED_HOST: ${{ matrix.host }}
          CACHE_ARCHIVE_SHA256: ${{ needs.v2-sources.outputs.cache_archive_sha256 }}
          CARGO_ARCHIVE_SHA256: ${{ fromJSON(needs.v2-cargo-catalog.outputs.cache_archives)[matrix.host] }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/diagnostic-runtime"
          producer="$RUNNER_TEMP/diagnostic-producer"
          git worktree add --detach "$producer" "$GITHUB_SHA"
          runtime_sha=$(shasum -a 256 "$runtime/bin/aros" | awk '{print $1}')
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cache-input/diagnostic-cache.tar.gz" \
            --archive-sha256 "$CACHE_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache"
          python3 -B scripts/toolchain/cache-archive-transport.py \
            --archive "$RUNNER_TEMP/diagnostic-cargo-input/native-cargo-cache.tar.gz" \
            --archive-sha256 "$CARGO_ARCHIVE_SHA256" --output-dir "$RUNNER_TEMP/diagnostic-cache/cargo"
          "$runtime/bin/aros" cache cargo verify --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --dir "$RUNNER_TEMP/diagnostic-cache" \
            --cargo "${{ steps.rust.outputs.cargo }}"
          bash scripts/toolchain/qualify-compiler-sdk-lane-v2.sh \
            --aros "$runtime/bin/aros" --runtime-sha256 "$runtime_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" \
            --selection "$producer/toolchains/compiler-sdk-ci-selection-v2.json" \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" --producer-dir "$producer" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" --cache-dir "$RUNNER_TEMP/diagnostic-cache" \
            --upstream-source-dir "$GITHUB_WORKSPACE/dependencies/upstream-aros" \
            --group "$SELECTED_GROUP" --preset "$SELECTED_PRESET" --host "$SELECTED_HOST" \
            --root "$RUNNER_TEMP/diagnostic-lane" --jobs 3 --timeout-seconds 20000
          sdk_ids=$(jq -cse '[.[].id] | sort | if length > 0 and . == unique then . else error("invalid SDK lane selection") end' \
            "$RUNNER_TEMP/diagnostic-lane/sdk-selections.jsonl")
          printf 'sdk-ids=%s\n' "$sdk_ids" >> "$GITHUB_OUTPUT"
      - id: sdk-origin
        name: Retain successful SDK payloads with original owning-job provenance
        uses: ./.github/actions/retain-sdk-owner-payload-v2
        with:
          operation-root: ${{ runner.temp }}/diagnostic-lane
          sdk-ids: ${{ steps.qualify.outputs.sdk-ids }}
          group: ${{ matrix.group_id }}
          preset: ${{ matrix.profile }}
          host: ${{ matrix.host }}
          root: ${{ runner.temp }}/diagnostic-sdk-origin
          workflow: .github/workflows/toolchain-release.yml
          job-name: Compiler A/B and SDK (${{ matrix.group_id }}, ${{ matrix.host }}, ${{ matrix.profile }})
      - name: Retain diagnostic results and failure logs; never release assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-v2-${{ matrix.group_id }}-${{ matrix.host }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/diagnostic-lane/*.json
            ${{ runner.temp }}/diagnostic-lane/compiler-*/payload/
            ${{ runner.temp }}/diagnostic-lane/compiler-*/work/native-lifecycle/logs/
            ${{ runner.temp }}/diagnostic-lane/compiler-*/work/native-lifecycle/receipts/
            ${{ runner.temp }}/diagnostic-lane/compiler-*/work/native-lifecycle/verified-source-usage.log
            ${{ runner.temp }}/diagnostic-lane/sdk-*/package/
            ${{ runner.temp }}/diagnostic-lane/sdk-*/reports/
            ${{ runner.temp }}/diagnostic-lane/sdk-*/local-evidence/
            ${{ runner.temp }}/diagnostic-lane/sdk-*/result.json
            ${{ runner.temp }}/diagnostic-lane/sdk-*/generation.json
            ${{ runner.temp }}/diagnostic-lane/sdk-*/cmake/**/*.log
            ${{ runner.temp }}/diagnostic-lane/sdk-*/cmake/**/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'produce'
    runs-on: ubuntu-24.04
    outputs:
      host_matrix: ${{ steps.matrix.outputs.host_matrix }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      verify_matrix: ${{ steps.matrix.outputs.verify_matrix }}
      release_id: ${{ steps.matrix.outputs.release_id }}
      prerelease: ${{ steps.release_tag.outputs.prerelease || 'false' }}
    steps:
      - name: Reject legacy publication during the V2 compiler and SDK migration
        if: github.event_name == 'push'
        run: |
          echo 'Compiler and SDK V2 release admission is not qualified. Use the non-publishing qualify-v2 dispatch; no tag publication is permitted.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release_tag
        name: Validate immutable release tag and channel before preparation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/toolchain/validate-release-tag.py \
            "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"
          if ! git check-ref-format "refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 ||
             [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ||
                "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]]; then
            echo "release requires an annotated tag on this exact producer commit" >&2
            exit 1
          fi
          local_object=$(git rev-parse "$GITHUB_REF_NAME^{tag}")
          remote_object=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')
          remote_commit=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')
          if [[ -z "$remote_object" || "$remote_object" != "$local_object" ||
                -z "$remote_commit" || "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "remote release tag identity differs from the triggering annotated tag" >&2
            exit 1
          fi
          if response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
            echo "release already exists for immutable tag; refusing another production run" >&2
            exit 1
          fi
          status_line=${response%%$'\n'*}
          if [[ ! "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]404([[:space:]]|$) ]]; then
            echo "cannot prove that the release is absent: $status_line" >&2
            exit 1
          fi
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: ${{ env.AROS_SOURCE_REPOSITORY }}
          ref: ${{ env.AROS_SOURCE_COMMIT }}
          fetch-depth: 0
          path: dependencies/aros
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: linux-x86_64
          destination: ${{ runner.temp }}/aros-tools-runtime
      - uses: ./.github/actions/checkout-locked-aros-tools-source
        with:
          path: dependencies/aros-tools
      - name: Probe the released source-cache command contract
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/aros-tools-source-cache-contract"
          mkdir -p "$cache_dir"
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          "$aros" cache sources list \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --dir "$cache_dir" \
            --format json >/dev/null
          "$aros" cache sources list \
            --compatibility-ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
            --dir "$cache_dir" \
            --format json >/dev/null
      - name: Materialize a distinct producer checkout
        run: |
          set -euo pipefail
          producer_dir="$RUNNER_TEMP/aros-toolchains-producer"
          test ! -e "$producer_dir"
          git worktree add --detach "$producer_dir" "$(git rev-parse HEAD)"
          printf 'AROS_PRODUCER_DIR=%s\n' "$producer_dir" >> "$GITHUB_ENV"
      - name: Bind three clean Git trees to the native producer recipe and plan
        run: |
          set -euo pipefail
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          "$aros" toolchain producer recipe \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
            --producer-dir "$AROS_PRODUCER_DIR" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --source-lock "$AROS_PRODUCER_DIR/$SOURCE_LOCK" \
            --profiles "$AROS_PRODUCER_DIR/$PROFILES" \
            --output "$GITHUB_WORKSPACE/recipe.json"
          for profile in pc-x86_64 arm-raspi rpi-aarch64; do
            "$aros" toolchain plan \
              --preset "$profile" \
              --recipe "$GITHUB_WORKSPACE/recipe.json" \
              --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
              --producer-dir "$AROS_PRODUCER_DIR" \
              --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
              --work-dir "$RUNNER_TEMP/plan-work-$profile" \
              --output-dir "$RUNNER_TEMP/plan-output-$profile" \
              --cache-dir "$RUNNER_TEMP/aros-tools-source-cache-contract" \
              --jobs 3 \
              --timeout-seconds 20000 \
              --format json | jq -e '.schema == "aros-toolchain-plan-v2" and .readiness == "ready"' >/dev/null
          done

      - id: matrix
        name: Select staged host matrix
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import itertools, json, os, sys
          hosts = [
              {"host": "linux-x86_64", "runner": "ubuntu-24.04"},
              {"host": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
              {"host": "macos-aarch64", "runner": "macos-15"},
          ]
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              scope = os.environ.get("REQUESTED_SCOPE") or "linux-x86_64"
              if scope == "linux-x86_64":
                  hosts = [item for item in hosts if item["host"] == scope]
              elif scope == "linux":
                  hosts = [item for item in hosts if item["host"].startswith("linux-")]
              else:
                  raise SystemExit(
                      "manual scope must be linux-x86_64 or linux; "
                      "the complete active three-host A/B matrix is tag-only; "
                      "macOS Intel is not a release target"
                  )
          profiles = ["pc-x86_64", "arm-raspi", "rpi-aarch64"]
          verify = [{**host, "profile": profile} for host, profile in itertools.product(hosts, profiles)]
          build = [{**item, "copy": copy} for item, copy in itertools.product(verify, ["a", "b"])]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          release_id = tag if os.environ.get("GITHUB_REF_TYPE") == "tag" else "toolchain-dev-" + os.environ["GITHUB_SHA"][:12]
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write("host_matrix=" + json.dumps({"include": hosts}, separators=(",", ":")) + "\n")
              output.write("build_matrix=" + json.dumps({"include": build}, separators=(",", ":")) + "\n")
              output.write("verify_matrix=" + json.dumps({"include": verify}, separators=(",", ":")) + "\n")
              output.write("release_id=" + release_id + "\n")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-recipe
          path: recipe.json
          if-no-files-found: error
          retention-days: 7

  sources:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: linux-x86_64
          destination: ${{ runner.temp }}/aros-tools-runtime
      - name: Fetch and verify immutable toolchain and host Python sources
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source-cache"
          "${{ steps.runtime.outputs.root }}/bin/aros" cache sources fetch \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --dir "$GITHUB_WORKSPACE/source-cache"
          "${{ steps.runtime.outputs.root }}/bin/aros" cache sources fetch \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --dir "$GITHUB_WORKSPACE/source-cache" \
            --offline
          "${{ steps.runtime.outputs.root }}/bin/aros" cache sources verify \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --dir "$GITHUB_WORKSPACE/source-cache"
          bash scripts/toolchain/seed-compatibility-zlib.sh \
            "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
            "$GITHUB_WORKSPACE/source-cache" \
            "$GITHUB_WORKSPACE/toolchains/source-seeds/chromium-zlib-da752eb2.tar.gz"
          for attempt in 1 2 3; do
            if "${{ steps.runtime.outputs.root }}/bin/aros" cache sources fetch \
              --compatibility-ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
              --dir "$GITHUB_WORKSPACE/source-cache"; then
              break
            fi
            echo "compatibility source fetch attempt $attempt/3 failed; incomplete cache entries (metadata only):" >&2
            "${{ steps.runtime.outputs.root }}/bin/aros" cache sources list \
              --compatibility-ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
              --dir "$GITHUB_WORKSPACE/source-cache" \
              --format json |
              jq -r '.entries[] | select(.state != "present_unverified") | [.role, .state, .filename] | @tsv' >&2
            if [[ "$attempt" -eq 3 ]]; then
              echo 'compatibility source fetch exhausted three bounded attempts' >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          "${{ steps.runtime.outputs.root }}/bin/aros" cache sources fetch \
            --compatibility-ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
            --dir "$GITHUB_WORKSPACE/source-cache" \
            --offline
          "${{ steps.runtime.outputs.root }}/bin/aros" cache sources verify \
            --compatibility-ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
            --dir "$GITHUB_WORKSPACE/source-cache"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-toolchain-sources
          path: source-cache/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  cargo:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/checkout-locked-aros-tools-source
        with:
          path: dependencies/aros-tools
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: ${{ matrix.host }}
          destination: ${{ runner.temp }}/aros-tools-runtime
      - name: Materialize a distinct producer checkout
        run: |
          set -euo pipefail
          producer_dir="$RUNNER_TEMP/aros-toolchains-producer"
          test ! -e "$producer_dir"
          git worktree add --detach "$producer_dir" "$(git rev-parse HEAD)"
          printf 'AROS_PRODUCER_DIR=%s\n' "$producer_dir" >> "$GITHUB_ENV"
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ runner.temp }}/aros-toolchains-producer
      - name: Fetch and verify the exact host Cargo vendor generation
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source-cache"
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          selector=(
            --producer-dir "$AROS_PRODUCER_DIR"
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools"
            --dir "$GITHUB_WORKSPACE/source-cache"
            --cargo "${{ steps.rust.outputs.cargo }}"
          )
          "$aros" cache cargo fetch "${selector[@]}"
          "$aros" cache cargo fetch "${selector[@]}" --offline
          "$aros" cache cargo verify "${selector[@]}"
          test -d "$GITHUB_WORKSPACE/source-cache/cargo"
          tar -C "$GITHUB_WORKSPACE/source-cache" -czf "$GITHUB_WORKSPACE/cargo-vendor.tar.gz" cargo
          (cd "$GITHUB_WORKSPACE" && shasum -a 256 cargo-vendor.tar.gz > cargo-vendor.tar.gz.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-cargo-${{ matrix.host }}
          path: |
            cargo-vendor.tar.gz
            cargo-vendor.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [plan, sources, cargo]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: ${{ env.AROS_SOURCE_REPOSITORY }}
          ref: ${{ env.AROS_SOURCE_COMMIT }}
          fetch-depth: 0
          path: dependencies/aros
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: toolchain-recipe
          path: producer-input

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-toolchain-sources
          path: source-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-cargo-${{ matrix.host }}
          path: cargo-cache-input

      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: ${{ matrix.host }}
          destination: ${{ runner.temp }}/aros-tools-runtime
      - uses: ./.github/actions/checkout-locked-aros-tools-source
        with:
          path: dependencies/aros-tools

      - name: Materialize a distinct producer checkout
        run: |
          set -euo pipefail
          producer_dir="$RUNNER_TEMP/aros-toolchains-producer"
          test ! -e "$producer_dir"
          git worktree add --detach "$producer_dir" "$(git rev-parse HEAD)"
          printf 'AROS_PRODUCER_DIR=%s\n' "$producer_dir" >> "$GITHUB_ENV"
      - id: rust
        uses: ./.github/actions/select-native-rust-toolchain
        with:
          producer-dir: ${{ runner.temp }}/aros-toolchains-producer

      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install pinned-lane build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake flex gawk libpng-dev libtool \
            netpbm ninja-build patch python3 xz-utils

      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install autoconf automake bison cmake gawk gnu-sed libtool make netpbm ninja xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Restore and verify the exact host Cargo vendor generation
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE/cargo-cache-input" && shasum -a 256 -c cargo-vendor.tar.gz.sha256)
          test ! -e "$GITHUB_WORKSPACE/source-cache/cargo"
          tar -C "$GITHUB_WORKSPACE/source-cache" -xzpf "$GITHUB_WORKSPACE/cargo-cache-input/cargo-vendor.tar.gz"
          "${{ steps.runtime.outputs.root }}/bin/aros" cache cargo verify \
            --producer-dir "$AROS_PRODUCER_DIR" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --dir "$GITHUB_WORKSPACE/source-cache" \
            --cargo "${{ steps.rust.outputs.cargo }}"

      - name: Build, package and read back one native candidate
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aros-${{ matrix.copy }}-${{ matrix.profile }}"
          candidate="$RUNNER_TEMP/candidate-${{ matrix.copy }}-${{ matrix.profile }}"
          environment="$RUNNER_TEMP/build-environment-${{ matrix.copy }}-${{ matrix.profile }}.json"
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          "$aros" toolchain build \
            --preset "${{ matrix.profile }}" \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
            --producer-dir "$AROS_PRODUCER_DIR" \
            --tools-dir "$GITHUB_WORKSPACE/dependencies/aros-tools" \
            --work-dir "$work" \
            --output-dir "$candidate" \
            --cache-dir "$GITHUB_WORKSPACE/source-cache" \
            --jobs 3 \
            --timeout-seconds 20000 \
            --release-id "${{ needs.plan.outputs.release_id }}"
          receipt="$work/native-lifecycle/receipts/publish.json"
          test -s "$receipt"
          jq -e '.schema == "aros-toolchain-receipt-v1" and .phase == "publish" and (.receipt_sha256 | test("^[0-9a-f]{64}$"))' "$receipt" >/dev/null
          "$aros" toolchain producer environment \
            --host "${{ matrix.host }}" \
            --output "$environment"
          "$aros" toolchain producer package \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --profiles "$GITHUB_WORKSPACE/$PROFILES" \
            --preset "${{ matrix.profile }}" \
            --release-id "${{ needs.plan.outputs.release_id }}" \
            --host "${{ matrix.host }}" \
            --build-environment "$environment" \
            --forbidden-prefix "$GITHUB_WORKSPACE" \
            --forbidden-prefix "$RUNNER_TEMP" \
            --input-dir "$candidate/toolchain" \
            --output-dir "$GITHUB_WORKSPACE/release-output"
          "$aros" toolchain producer verify-package \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --profiles "$GITHUB_WORKSPACE/$PROFILES" \
            --preset "${{ matrix.profile }}" \
            --release-id "${{ needs.plan.outputs.release_id }}" \
            --host "${{ matrix.host }}" \
            --build-environment "$environment" \
            --forbidden-prefix "$GITHUB_WORKSPACE" \
            --forbidden-prefix "$RUNNER_TEMP" \
            --input-dir "$GITHUB_WORKSPACE/release-output"

      - name: Preserve native lifecycle receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lifecycle-${{ matrix.host }}-${{ matrix.profile }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/aros-${{ matrix.copy }}-${{ matrix.profile }}/native-lifecycle/receipts/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.host }}-${{ matrix.profile }}-${{ matrix.copy }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.verify_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: linux-x86_64
          destination: ${{ runner.temp }}/aros-tools-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ matrix.host }}-${{ matrix.profile }}-a
          path: candidate-a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ matrix.host }}-${{ matrix.profile }}-b
          path: candidate-b
      - name: Require byte-identical complete native package sets
        run: |
          set -euo pipefail
          "${{ steps.runtime.outputs.root }}/bin/aros" toolchain producer compare \
            --left "$GITHUB_WORKSPACE/candidate-a" \
            --right "$GITHUB_WORKSPACE/candidate-b" \
            --output "$RUNNER_TEMP/comparison-${{ matrix.host }}-${{ matrix.profile }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.host }}-${{ matrix.profile }}
          path: candidate-a/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-${{ matrix.host }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/comparison-${{ matrix.host }}-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    needs: [plan, compare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: ${{ env.AROS_SOURCE_REPOSITORY }}
          ref: ${{ env.AROS_SOURCE_COMMIT }}
          path: dependencies/aros
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: toolchain-recipe
          path: producer-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-${{ matrix.host }}-${{ matrix.profile }}
          path: verified
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-toolchain-sources
          path: source-cache
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: ${{ matrix.host }}
          destination: ${{ runner.temp }}/aros-tools-runtime
      - id: profile
        name: Select the recipe-bound upstream source
        run: |
          set -euo pipefail
          profile="$("${{ steps.runtime.outputs.root }}/bin/aros" toolchain producer profile \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --profiles "$GITHUB_WORKSPACE/$PROFILES" \
            --preset "${{ matrix.profile }}" \
            --format json)"
          printf 'upstream_commit=%s\n' "$(jq -er '.upstream_commit' <<< "$profile")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/checkout-pinned-recursive-source
        with:
          repository: aros-development-team/AROS
          ref: ${{ steps.profile.outputs.upstream_commit }}
          fetch-depth: 1
          path: dependencies/upstream-aros
      - uses: ./.github/actions/disable-google-chrome-apt-source
        if: runner.os == 'Linux'
      - name: Install audited consumer prerequisites
        run: bash dependencies/aros/scripts/ci/install-build-prerequisites.sh
      - name: Execute two-root native compatibility qualification
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/native-compatibility-${{ matrix.host }}-${{ matrix.profile }}"
          environment="$RUNNER_TEMP/compatibility-environment-${{ matrix.host }}-${{ matrix.profile }}.json"
          mkdir -p "$work/engine-work"
          aros="${{ steps.runtime.outputs.root }}/bin/aros"
          "$aros" toolchain producer environment \
            --host "${{ matrix.host }}" \
            --output "$environment"
          "$aros" toolchain producer materialize-engine-free-source \
            --source-dir "$GITHUB_WORKSPACE/dependencies/aros" \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --output-dir "$work/engine-free-source"
          # The executor owns this explicit command-role contract. Measure one
          # absolute executable per role and expose only those symlinks to the
          # sealed CMake/configure/Make children; do not reconstruct PATH from
          # runner directories. `make` is a stable child role, even where the
          # selected macOS implementation is Homebrew gmake.
          host_tool_args=()
          while IFS= read -r role; do
            [[ -n "$role" ]] || continue
            case "$role" in
            make)
              program="$(type -P gmake || type -P make || true)"
              ;;
            # Darwin's /usr/bin/{ar,ranlib} are xcrun shims. Resolve the real,
            # measured Xcode tool first: a closure alias to the shim would
            # preserve llvm-arcc/llvm-ranlibcc as argv[0] and fail again.
            llvm-arcc)
              xcrun_program="$(type -P xcrun || true)"
              program=""
              if [[ "$xcrun_program" == /* && -x "$xcrun_program" ]]; then
                program="$("$xcrun_program" --find ar 2>/dev/null || true)"
              fi
              ;;
            llvm-ranlibcc)
              xcrun_program="$(type -P xcrun || true)"
              program=""
              if [[ "$xcrun_program" == /* && -x "$xcrun_program" ]]; then
                program="$("$xcrun_program" --find ranlib 2>/dev/null || true)"
              fi
              ;;
            *)
              # `command -v` returns a bare shell-builtin name for roles such
              # as echo or test. The closure requires an executable file.
              program="$(type -P "$role" || true)"
              ;;
            esac
            if [[ "$program" != /* || ! -x "$program" ]]; then
              echo "compatibility qualification requires an absolute executable host tool for role '$role'" >&2
              exit 1
            fi
            host_tool_args+=(--host-tool "$role=$program")
          done < <("$aros" toolchain producer compatibility-host-tools --host "${{ matrix.host }}")
          if (( ${#host_tool_args[@]} == 0 )); then
            echo "compatibility qualification executor reported no required host-tool roles" >&2
            exit 1
          fi
          "$aros" toolchain producer compatibility \
            --recipe "$GITHUB_WORKSPACE/producer-input/recipe.json" \
            --source-lock "$GITHUB_WORKSPACE/$SOURCE_LOCK" \
            --profiles "$GITHUB_WORKSPACE/$PROFILES" \
            --preset "${{ matrix.profile }}" \
            --release-id "${{ needs.plan.outputs.release_id }}" \
            --host "${{ matrix.host }}" \
            --build-environment "$environment" \
            --package-dir "$GITHUB_WORKSPACE/verified" \
            --first-root "$work/package-cmake" \
            --second-root "$work/package-upstream" \
            --source-dir "$work/engine-free-source" \
            --engine-work-dir "$work/engine-work" \
            --helpers-dir "${{ steps.runtime.outputs.root }}/bin" \
            --cmake-program "$(command -v cmake)" \
            --ninja-program "$(command -v ninja)" \
            --upstream-source-dir "$GITHUB_WORKSPACE/dependencies/upstream-aros" \
            --upstream-build-dir "$work/upstream-build" \
            --python-cache-dir "$GITHUB_WORKSPACE/source-cache" \
            --ports-lock "$GITHUB_WORKSPACE/$COMPATIBILITY_PORTS_LOCK" \
            --ports-cache-dir "$GITHUB_WORKSPACE/source-cache" \
            --ports-sources-dir "$work/ports-sources" \
            --python-environment-dir "$work/python" \
            --host-tools-dir "$work/host-tools" \
            "${host_tool_args[@]}" \
            --cmake-build-dir "$work/cmake-build" \
            --c-fixture "$GITHUB_WORKSPACE/scripts/toolchain/fixtures/smoke.c" \
            --cxx-fixture "$GITHUB_WORKSPACE/scripts/toolchain/fixtures/smoke.cpp" \
            --standalone-output-dir "$work/standalone" \
            --reports-dir "$work/reports" \
            --jobs 3 \
            --timeout-seconds 3600 \
            --format json
      - name: Preserve native compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.host }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/native-compatibility-${{ matrix.host }}-${{ matrix.profile }}/reports/
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [plan, compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: runtime
        uses: ./.github/actions/materialize-aros-tools-runtime
        with:
          host: linux-x86_64
          destination: ${{ runner.temp }}/aros-tools-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-*-pc-x86_64
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-*-arm-raspi
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-*-rpi-aarch64
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: toolchain-recipe
          path: release-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-lifecycle-*
          path: qualification-input/lifecycle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: comparison-*
          path: qualification-input/comparison
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: compatibility-*
          path: qualification-input/compatibility
      - name: Require the complete native qualification handoff before attestation
        run: |
          set -euo pipefail
          for host in linux-x86_64 linux-aarch64 macos-aarch64; do
            for profile in pc-x86_64 arm-raspi rpi-aarch64; do
              for copy in a b; do
                receipt="qualification-input/lifecycle/native-lifecycle-$host-$profile-$copy/publish.json"
                test -s "$receipt" || {
                  echo "missing native publish receipt: $receipt" >&2
                  exit 1
                }
              done
              test -s "qualification-input/comparison/comparison-$host-$profile/comparison-$host-$profile.json"
              test -s "qualification-input/compatibility/compatibility-$host-$profile/native-compatibility.receipt.json"
            done
          done
      - name: Add immutable recipe inputs
        run: |
          set -euo pipefail
          cp release-input/recipe.json release/toolchain-recipe-v2.json
          cp "$SOURCE_LOCK" release/
          cp "$PROFILES" release/
          cp toolchains/toolchain-manifest-v1.schema.json release/
          cp toolchains/tree-digest-v1.fixture.json release/
      - name: Generate release index and checksums
        run: |
          set -euo pipefail
          "${{ steps.runtime.outputs.root }}/bin/aros" toolchain producer index \
            --directory "$GITHUB_WORKSPACE/release" \
            --release-id "$GITHUB_REF_NAME" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --source-lock-filename "$(basename "$SOURCE_LOCK")" \
            --stage pre-attestation
      - name: Attest checksummed release files
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-checksums: release/SHA256SUMS

      - name: Verify signed pre-attestation inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [[ $(git cat-file -t "$GITHUB_REF_NAME") != tag ]]; then
            echo "producer release tag must be annotated" >&2
            exit 1
          fi
          source_tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          "$GITHUB_WORKSPACE/scripts/toolchain/verify-provenance-attestation.sh" \
            --checksums "$GITHUB_WORKSPACE/release/SHA256SUMS" \
            --bundle "$PROVENANCE_BUNDLE" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/toolchain-release.yml" \
            --source-digest "$source_tag_commit" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/verified-pre-attestation.json"

      - name: Include provenance bundle and refresh checksums
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" release/toolchain-provenance.sigstore.json
          "${{ steps.runtime.outputs.root }}/bin/aros" toolchain producer index \
            --directory "$GITHUB_WORKSPACE/release" \
            --release-id "$GITHUB_REF_NAME" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --source-lock-filename "$(basename "$SOURCE_LOCK")" \
            --stage final
      - name: Record closed qualification evidence
        run: |
          set -euo pipefail
          if [[ $(git cat-file -t "$GITHUB_REF_NAME") != tag ]]; then
            echo "producer release tag must be annotated" >&2
            exit 1
          fi
          source_tag_object=$(git rev-parse "$GITHUB_REF_NAME^{tag}")
          source_tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test -s "$RUNNER_TEMP/verified-pre-attestation.json"
          now=$(date -u +%s)
          expires_at=$((now + 604800))
          mkdir -p "$RUNNER_TEMP/qualification"
          "${{ steps.runtime.outputs.root }}/bin/aros" toolchain producer record-qualification \
            --release-dir "$GITHUB_WORKSPACE/release" \
            --source-lock-filename "$(basename "$SOURCE_LOCK")" \
            --lifecycle-reports-dir "$GITHUB_WORKSPACE/qualification-input/lifecycle" \
            --comparison-reports-dir "$GITHUB_WORKSPACE/qualification-input/comparison" \
            --compatibility-reports-dir "$GITHUB_WORKSPACE/qualification-input/compatibility" \
            --source-repository "https://github.com/$GITHUB_REPOSITORY" \
            --source-workflow ".github/workflows/toolchain-release.yml" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-tag "$GITHUB_REF_NAME" \
            --source-tag-object "$source_tag_object" \
            --source-tag-commit "$source_tag_commit" \
            --attestation-repository "https://github.com/$GITHUB_REPOSITORY" \
            --attestation-workflow ".github/workflows/toolchain-release.yml" \
            --attestation-signer "github-actions" \
            --created-at "$now" \
            --expires-at "$expires_at" \
            --output "$RUNNER_TEMP/qualification/qualification-evidence-v1.json"
      - name: Preserve complete recovery inputs before the draft handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-final-release
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence
          path: ${{ runner.temp }}/qualification/qualification-evidence-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          local_object=$(git rev-parse "$GITHUB_REF_NAME^{tag}")
          local_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          remote_object=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')
          remote_commit=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')
          if [[ -z "$remote_object" || "$remote_object" != "$local_object" ||
                -z "$remote_commit" || "$remote_commit" != "$local_commit" ||
                "$local_commit" != "$GITHUB_SHA" ]]; then
            echo "release tag changed during qualification; refusing to create a draft" >&2
            exit 1
          fi
          if response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
            echo "release already exists; refusing to replace assets" >&2
            exit 1
          fi
          status_line=${response%%$'\n'*}
          if [[ ! "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]404([[:space:]]|$) ]]; then
            echo "cannot prove that the release is absent: $status_line" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          if [[ ${#assets[@]} -ne 44 ]]; then
            echo "active three-host release inventory must contain exactly 44 regular files, found ${#assets[@]}" >&2
            exit 1
          fi
          prerelease_args=()
          case "$RELEASE_PRERELEASE" in
            true) prerelease_args=(--prerelease) ;;
            false) ;;
            *) echo "release channel classification is missing or invalid" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "AROS Toolchains $GITHUB_REF_NAME" \
            --notes "Built twice, byte-compared, relocation-tested, and verified against the pinned upstream AROS commit. This release remains a draft for independent verification before publication." \
            "${prerelease_args[@]}" \
            "${assets[@]}"

  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover'
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/toolchain-release-recovery.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_tag: ${{ inputs.source_tag }}
      release_tag: ${{ inputs.release_tag }}
