            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --source-workflow .github/workflows/toolchain-release.yml --source-ref "$GITHUB_REF" \
            --workflow .github/workflows/toolchain-release.yml --job-name "$CURRENT_JOB" --same-attempt \
            --release-id "$SELECTED_RELEASE_ID" \
            --forbidden-prefix "$GITHUB_WORKSPACE" --forbidden-prefix "$RUNNER_TEMP" \
            --root "$RUNNER_TEMP/complete-compiler-readback"
          bash scripts/toolchain/collect-sdk-owners-v2.sh \
            --aros "$runtime/bin/aros" --aros-sha256 "$runtime_sha" \
            --inputs-dir "$RUNNER_TEMP/diagnostic-inputs" --inputs-sha256 "$inputs_sha" \
            --producer-commit "$GITHUB_SHA" --tools-commit "$EXPECTED_TOOLS" \
            --source-context "$context" --source-context-sha256 "$context_sha" \
            --source-workflow .github/workflows/toolchain-release.yml --source-ref "$GITHUB_REF" \
            --workflow .github/workflows/toolchain-release.yml --job-name "$CURRENT_JOB" --same-attempt \
            --root "$RUNNER_TEMP/complete-sdk-readback"
          plan="$RUNNER_TEMP/sdk-index-native-plan.json"
          package_inputs="$RUNNER_TEMP/sdk-package-inputs.json"
