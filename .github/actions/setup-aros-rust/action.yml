name: Set up the pinned AROS Rust toolchain
description: Install the exact Rust toolchain declared by the release contract

runs:
  using: composite
  steps:
    - id: contract
      name: Read the Rust release contract
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        contract = Path(os.environ["GITHUB_WORKSPACE"]) / "toolchains" / "rust-toolchain.toml"
        with contract.open("rb") as source:
            toolchain = tomllib.load(source)["toolchain"]
        channel = toolchain.get("channel")
        components = toolchain.get("components")
        if not isinstance(channel, str) or not channel:
            raise SystemExit(f"{contract}: toolchain.channel must be a non-empty string")
        if not isinstance(components, list) or not components or not all(
            isinstance(component, str) and component for component in components
        ):
            raise SystemExit(f"{contract}: toolchain.components must be a non-empty string list")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            output.write(f"channel={channel}\n")
            output.write(f"components={','.join(components)}\n")
        PY

    - name: Install Rust ${{ steps.contract.outputs.channel }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.contract.outputs.channel }}
        components: ${{ steps.contract.outputs.components }}
