# Persistent runner for metaneutrons/aros-toolchains on a UGOS NAS (kirk, picard).
# Deploy with ugos-cli, not with docker compose on the NAS; see README.md.
# RUNNER_TOKEN is needed for the first start only. Create it with
#   gh api -X POST repos/metaneutrons/aros-toolchains/actions/runners/registration-token --jq .token
services:
  runner:
    image: aros-toolchains-runner:local
    container_name: ${RUNNER_NAME}
    environment:
      RUNNER_NAME: ${RUNNER_NAME:?set the runner name}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - runner-state:/home/ci/state
      - runner-work:/home/ci/actions-runner/_work
# Pin the subnet. Without it Docker takes the next range from its default pool, which
# can be a range the host's LAN already uses, and the host stops answering that LAN.
networks:
  default:
    ipam:
      config:
        - subnet: ${RUNNER_SUBNET:?set a fixed subnet, for example 10.200.128.0/24}
volumes:
  runner-state:
  runner-work:
